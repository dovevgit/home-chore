<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הבית שלנו | חנות</title>
<meta name="theme-color" content="#0D6EFD">
<meta name="color-scheme" content="only light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="js/splash.js"></script>
<link rel="stylesheet" href="css/style.css">
<style>
.balance{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:12px;border-radius:20px;background:linear-gradient(135deg,#FFF3C4,#FFD36B);border:3px solid #F5A400;color:#5A2A00}
.balance .bnum{font-size:38px;font-weight:800;line-height:1}
.balance small{display:block;font-weight:700;font-size:15px}
.shopgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcardx{background:#fff;border-radius:16px;padding:10px;box-shadow:0 2px 6px rgba(31,41,55,.08);display:flex;flex-direction:column;gap:6px;min-width:0}
.pimgx{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#EAF3FF;display:flex;align-items:center;justify-content:center;font-size:54px}
.pcardx b{font-size:17px;overflow-wrap:anywhere}
.pcardx .pdesc{font-size:13.5px;color:var(--text2);overflow-wrap:anywhere}
.pprice{display:inline-flex;align-self:flex-start;align-items:center;gap:4px;background:#FFE9A8;color:#7A4A00;border-radius:999px;padding:2px 10px;font-weight:800;font-size:15px}
.pcardx .btn{margin-top:auto;height:44px;font-size:17px}
.pcardx.off{opacity:.6}
.prow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:0 2px 6px rgba(31,41,55,.06)}
.prow .pmain{flex:1;min-width:0}.prow small{display:block;color:var(--text2);font-weight:700}
.prow .bt{border:0;border-radius:12px;padding:8px 14px;font:inherit;font-weight:800;cursor:pointer}
.bt.ok{background:#CFF3D6;color:#14532D}.bt.no{background:#FFDADA;color:#991B1B}
.hdrow{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}
.hdrow .sec-title{margin:0}
.smallbtn{border:0;border-radius:12px;background:#EAF3FF;color:#0A58CA;font:inherit;font-weight:800;padding:8px 14px;cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="balance"><span style="font-size:44px">⭐</span><div><small>היתרה שלי</small><div class="bnum" id="bal" dir="ltr">…</div><small id="pend"></small></div></div>
  <div id="adminBox" class="hidden"><div class="sec-title" style="margin-top:0">בקשות לאישור</div><div id="pending"></div></div>
  <div class="hdrow"><div class="sec-title">החנות</div><button class="smallbtn hidden" id="addItem" type="button">+ מוצר חדש</button></div>
  <div id="items" class="shopgrid"><p class="empty">טוען...</p></div>
  <div class="sec-title" style="margin-top:22px">הרכישות שלי</div>
  <div id="mine"><p class="empty">אין רכישות עדיין</p></div>
</main>
<div class="modal hidden" id="modal"><div class="modal-card" id="modalCard"></div></div>
<script type="module">
import { initPage, supabase, esc, icon, avatar, showToast } from './js/common.js';
import { lifetimePoints } from './js/points.js';
const { me, profiles, isAdmin } = await initPage({ active: 'shop', title: 'חנות', back: 'index.html' });
const byId = Object.fromEntries(profiles.map(p => [p.id, p]));
const $ = id => document.getElementById(id);
const ST = { pending: ['ממתין לאישור', 's-waiting'], approved: ['נמסר', 's-done'], rejected: ['נדחה', 's-overdue'] };
let items = [], purchases = [], earned = {};
const spentOf = uid => purchases.filter(p => p.user_id === uid && p.status !== 'rejected').reduce((a, p) => a + p.price, 0);
const balOf = uid => (earned[uid] || 0) - spentOf(uid);
const close = () => $('modal').classList.add('hidden');
$('modal').addEventListener('click', e => { if (e.target === $('modal')) close(); });

async function load() {
  const [it, pu, lp] = await Promise.all([
    supabase.from('shop_items').select('*').order('price'),
    supabase.from('purchases').select('*').order('created_at', { ascending: false }),
    lifetimePoints()
  ]);
  items = it.data || []; purchases = pu.data || []; earned = lp.earnedByUser || {};
  render();
}
function render() {
  const bal = balOf(me.id), pend = purchases.filter(p => p.user_id === me.id && p.status === 'pending').reduce((a, p) => a + p.price, 0);
  $('bal').textContent = bal;
  $('pend').textContent = pend ? `${pend} נקודות שמורות לבקשות שממתינות` : '';
  $('items').innerHTML = items.length ? items.map(i => {
    const can = bal >= i.price;
    return `<div class="pcardx ${i.active ? '' : 'off'}">
      ${i.photo ? `<img class="pimgx" src="${i.photo}" alt="">` : '<div class="pimgx">🎁</div>'}
      <b>${esc(i.name)}</b>${i.description ? `<span class="pdesc">${esc(i.description)}</span>` : ''}
      <span class="pprice">⭐ <span dir="ltr">${i.price}</span></span>
      ${i.active ? `<button class="btn ${can ? '' : 'disabled'}" data-buy="${i.id}" type="button" ${can ? '' : 'disabled'}>${can ? 'מימוש' : `חסרות ${i.price - bal}`}</button>` : '<small>מוסתר מהילדים</small>'}
      ${isAdmin ? `<button class="smallbtn" data-edit="${i.id}" type="button">עריכה</button>` : ''}</div>`;
  }).join('') : `<p class="empty" style="grid-column:1/-1">${isAdmin ? 'עוד אין מוצרים. לחצו על "+ מוצר חדש".' : 'עוד אין מוצרים בחנות'}</p>`;
  const mine = purchases.filter(p => p.user_id === me.id);
  $('mine').innerHTML = mine.length ? mine.map(p => `<div class="prow"><div class="pmain"><b>${esc(p.item_name)}</b><small>⭐ <span dir="ltr">${p.price}</span> · ${new Date(p.created_at).toLocaleDateString('he-IL')}</small></div>
    <span class="chip ${ST[p.status][1]}">${ST[p.status][0]}</span>
    ${p.status === 'pending' ? `<button class="bt no" data-cancel="${p.id}" type="button">ביטול</button>` : ''}</div>`).join('') : '<p class="empty">אין רכישות עדיין</p>';
  if (isAdmin) {
    $('addItem').classList.remove('hidden'); $('adminBox').classList.remove('hidden');
    const pend2 = purchases.filter(p => p.status === 'pending').slice().reverse();
    $('pending').innerHTML = pend2.length ? pend2.map(p => `<div class="prow">${avatar(byId[p.user_id], 40)}<div class="pmain"><b>${esc(byId[p.user_id]?.name || '')} רוצה: ${esc(p.item_name)}</b>
      <small>⭐ <span dir="ltr">${p.price}</span> · היתרה שלו/ה: <span dir="ltr">${(earned[p.user_id] || 0) - spentOf(p.user_id) + p.price}</span> לפני הבקשה</small></div>
      <button class="bt ok" data-ok="${p.id}" type="button">נמסר</button><button class="bt no" data-no="${p.id}" type="button">דחייה</button></div>`).join('') : '<p class="empty">אין בקשות ממתינות</p>';
  }
}
document.querySelector('main').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.buy) {
    const it = items.find(x => x.id === b.dataset.buy); if (!it) return;
    if (balOf(me.id) < it.price) return showToast('אין מספיק נקודות', true);
    if (!confirm(`לממש "${it.name}" תמורת ${it.price} נקודות?\\nהנקודות יישמרו עד שהורה יאשר.`)) return;
    b.disabled = true;
    const { error } = await supabase.from('purchases').insert({ user_id: me.id, item_id: it.id, item_name: it.name, price: it.price });
    if (error) { showToast('הבקשה נכשלה', true); b.disabled = false; return; }
    showToast('הבקשה נשלחה להורים'); await load();
  } else if (b.dataset.cancel) {
    if (!confirm('לבטל את הבקשה? הנקודות יחזרו אליך.')) return;
    await supabase.from('purchases').delete().eq('id', b.dataset.cancel); await load();
  } else if (b.dataset.ok || b.dataset.no) {
    const id = b.dataset.ok || b.dataset.no, status = b.dataset.ok ? 'approved' : 'rejected';
    if (status === 'rejected' && !confirm('לדחות? הנקודות יחזרו לילד/ה.')) return;
    const { error } = await supabase.from('purchases').update({ status, decided_at: new Date().toISOString() }).eq('id', id);
    if (error) return showToast('העדכון נכשל', true);
    await load();
  } else if (b.dataset.edit) openItem(items.find(x => x.id === b.dataset.edit));
});
$('addItem').onclick = () => openItem(null);

const shrink = (file, max = 480) => new Promise((res, rej) => {
  const url = URL.createObjectURL(file), im = new Image();
  im.onload = () => {
    const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    let q = 0.75, out = c.toDataURL('image/jpeg', q);
    while (out.length > 250000 && q > 0.3) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
    res(out);
  };
  im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad')); };
  im.src = url;
});
function openItem(it) {
  let photo = it?.photo || null;
  $('modalCard').innerHTML = `<button type="button" class="modal-x" id="mx" aria-label="סגירה">${icon('x', 20)}</button>
    <h2 style="margin:0 0 6px">${it ? 'עריכת מוצר' : 'מוצר חדש'}</h2>
    <label for="iN">שם המוצר או המתנה</label><input id="iN" maxlength="60" value="${esc(it?.name || '')}">
    <label for="iD">תיאור (לא חובה)</label><input id="iD" maxlength="200" value="${esc(it?.description || '')}">
    <label for="iP">מחיר בנקודות</label><input id="iP" type="number" min="1" inputmode="numeric" value="${it?.price || ''}" dir="ltr">
    <div id="iPrev" style="margin-top:10px"></div>
    <div class="grid2" style="margin-top:6px"><button class="btn secondary small" id="iCam" type="button" style="margin:0">📷 צילום</button><button class="btn secondary small" id="iGal" type="button" style="margin:0">🖼️ תמונה</button></div>
    <input type="file" id="fCam" accept="image/*" capture="environment" hidden><input type="file" id="fGal" accept="image/*" hidden>
    <div class="switch"><span><b>מוצג לילדים</b></span><input id="iA" type="checkbox" ${it ? (it.active ? 'checked' : '') : 'checked'}></div>
    <p class="error" id="iErr" role="alert"></p>
    <button class="btn" id="iSave" type="button">שמירה</button>
    ${it ? '<button class="btn secondary" id="iDel" type="button" style="color:#B91C1C;border-color:#EF4444">מחיקת המוצר</button>' : ''}`;
  $('modal').classList.remove('hidden'); $('mx').onclick = close;
  const prev = () => { $('iPrev').innerHTML = photo ? `<div style="position:relative"><img src="${photo}" alt="" style="width:100%;max-height:200px;object-fit:contain;border-radius:10px;background:#F3F4F6"><button type="button" class="modal-x" id="iRm" aria-label="הסרה" style="top:6px">${icon('x', 18)}</button></div>` : ''; const r = $('iRm'); if (r) r.onclick = () => { photo = null; prev(); }; };
  prev();
  const pick = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try { photo = await shrink(f); prev(); } catch (_) { $('iErr').textContent = 'לא הצלחנו לקרוא את התמונה'; } };
  $('iCam').onclick = () => $('fCam').click(); $('iGal').onclick = () => $('fGal').click(); $('fCam').onchange = pick; $('fGal').onchange = pick;
  $('iSave').onclick = async () => {
    const row = { name: $('iN').value.trim(), description: $('iD').value.trim() || null, price: parseInt($('iP').value), photo, active: $('iA').checked };
    if (!row.name) return ($('iErr').textContent = 'צריך שם למוצר');
    if (!(row.price >= 1)) return ($('iErr').textContent = 'צריך מחיר בנקודות');
    $('iSave').disabled = true;
    const { error } = it ? await supabase.from('shop_items').update(row).eq('id', it.id) : await supabase.from('shop_items').insert(row);
    if (error) { $('iErr').textContent = 'השמירה נכשלה: ' + error.message; $('iSave').disabled = false; return; }
    close(); await load();
  };
  if (it) $('iDel').onclick = async () => {
    if (!confirm('למחוק את המוצר? רכישות קודמות נשמרות.')) return;
    const { error } = await supabase.from('shop_items').delete().eq('id', it.id);
    if (error) return ($('iErr').textContent = 'המחיקה נכשלה');
    close(); await load();
  };
}
await load();
</script>
</body>
</html>
