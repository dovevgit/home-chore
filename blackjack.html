<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הבית שלנו | 21</title>
<meta name="theme-color" content="#0b1411">
<meta name="color-scheme" content="only light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="js/splash.js"></script>
<link rel="stylesheet" href="css/style.css">
<style>
/* כל הכיתות של משחק ה-21 מתחילות ב-bj כדי לא להתנגש בעיצוב של שאר האפליקציה */
:root{--bjground:#0b1411;--bjfelt:#17674d;--bjfelt2:#0e4535;--bjrim:#4a2f1c;--bjgold:#e8bd4f;--bjtext:#f1ece0;--bjmuted:#9fb3a9;--bjpanel:#12201b;--bjline:#24382f;--bjred:#c9372c;--bjgood:#58c27d;--bjbad:#e5604f}
body{background:var(--bjground) fixed;background-color:var(--bjground)}
#bjm{max-width:460px;margin:0 auto;padding:0 12px 28px;display:flex;flex-direction:column;gap:12px;color:var(--bjtext)}
#bjm *{box-sizing:border-box}
.bjbar{display:flex;align-items:center;gap:8px}
.bjbar b{flex:1;font-size:20px;color:var(--bjgold);white-space:nowrap}
.bjbank{font-weight:800;color:var(--bjgold);white-space:nowrap;font-size:14px}
.bjchip{white-space:nowrap;background:var(--bjpanel);border:1px solid var(--bjline);border-radius:10px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700;color:var(--bjtext);cursor:pointer}
.bjpanel{background:var(--bjpanel);border:1px solid var(--bjline);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.bjpanel h2{margin:0;font-size:19px;color:var(--bjgold)}
.bjpanel h3{margin:8px 0 0;font-size:15px}
.bjtable{background:radial-gradient(120% 90% at 50% 20%,var(--bjfelt),var(--bjfelt2));border:6px solid var(--bjrim);border-radius:26px;box-shadow:0 10px 28px rgba(0,0,0,.5),inset 0 0 0 2px rgba(232,189,79,.35);padding:14px 8px 12px;display:flex;flex-direction:column;gap:12px}
.bjzone{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:96px}
.bjwho{font-size:13px;font-weight:800;color:#d9e6df;display:flex;gap:8px;align-items:center;max-width:100%}
.bjwho span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}
.bjtot{background:rgba(0,0,0,.35);border-radius:999px;padding:1px 9px;font-size:12px;min-width:24px;text-align:center}
.bjhands{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bjhand{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 6px;border-radius:12px;border:2px solid transparent}
.bjhand.active{border-color:var(--bjgold);box-shadow:0 0 14px rgba(232,189,79,.5)}
.bjcards{display:flex;direction:ltr;min-height:62px}
.bjcard{width:44px;height:62px;border-radius:7px;background:#fbf8f0;color:#1b1b1b;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;padding:5px 0 0 6px;gap:2px;font-weight:800;font-size:17px;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.45);margin-inline-start:-22px;direction:ltr}
.bjcard:first-child{margin-inline-start:0}
.bjcard.red{color:var(--bjred)}
.bjcard .s{font-size:18px}
.bjcard.back{background:repeating-linear-gradient(45deg,#1d3f8a,#1d3f8a 5px,#2a55b0 5px,#2a55b0 10px);border:2px solid #fbf8f0}
.bjcard.back *{display:none}
.bjcard.new{animation:bjdeal .3s ease-out}
@keyframes bjdeal{from{transform:translateY(-30px) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.bjbadge{font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;background:rgba(0,0,0,.4)}
.bjbadge.win{background:var(--bjgood);color:#05210f}
.bjbadge.lose{background:var(--bjbad);color:#fff}
.bjbadge.push{background:#cdd6d2;color:#111}
.bjbadge.bj{background:var(--bjgold);color:#2a1d00}
.bjbet{display:flex;align-items:center;gap:6px;font-size:12px;color:#d9e6df}
.bjbet i{width:18px;height:18px;border-radius:50%;border:3px dashed #fff;background:#b8322b;display:inline-block}
.bjseats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bjseat{background:rgba(0,0,0,.22);border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:120px}
.bjseat .bjcard{width:34px;height:48px;font-size:14px;margin-inline-start:-17px;padding:4px 0 0 4px}
.bjseat .bjcard:first-child{margin-inline-start:0}
.bjseat .bjcard .s{font-size:14px}
.bjseat .bjcards{min-height:48px}
.bjseat.gone{opacity:.4}
.bjme{background:rgba(0,0,0,.28);border:2px solid rgba(232,189,79,.45);border-radius:18px;padding:10px 6px}
.bjmsg{text-align:center;font-weight:800;min-height:24px;color:var(--bjgold)}
.bjchips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.bjchipb{width:54px;height:54px;border-radius:50%;border:4px dashed rgba(255,255,255,.85);font:inherit;font-weight:800;font-size:15px;color:#fff;box-shadow:0 3px 6px rgba(0,0,0,.5);cursor:pointer}
.bjchipb:disabled{opacity:.35;cursor:default}
.bjchipb.c10{background:#2f6fd1}.bjchipb.c25{background:#1f8f5a}.bjchipb.c50{background:#b8322b}.bjchipb.c100{background:#262626}
.bjrow{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(90px,1fr))}
.bjbtn{border:0;border-radius:14px;padding:13px 8px;font:inherit;font-weight:800;font-size:16px;background:var(--bjgold);color:#1d1500;cursor:pointer;width:100%}
.bjbtn.sec{background:#24382f;color:var(--bjtext);font-size:15px}
.bjbtn.stand{background:#c9463a;color:#fff}
.bjbtn:disabled{opacity:.35;cursor:default}
.bjline{text-align:center;font-weight:800}
.bjtimer{display:flex;align-items:center;gap:10px;min-height:28px}
.bjtl{font-size:13px;font-weight:700;color:var(--bjmuted);white-space:nowrap}
.bjtbar{flex:1;height:12px;border-radius:7px;background:rgba(0,0,0,.45);overflow:hidden;direction:ltr}
.bjtfill{height:100%;width:100%;background:var(--bjgood);border-radius:7px;transition:width .25s linear,background .3s}
.bjtfill.mid{background:#e8a13a}.bjtfill.low{background:var(--bjbad)}
.bjtt{font-size:20px;font-weight:800;min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.bjrowl{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--bjline);text-decoration:none;color:inherit}
.bjrowl:first-of-type{border-top:0}
.bjrowl b{flex:1}
.bjrowl small{color:var(--bjmuted)}
.bjjoin{border:0;border-radius:10px;padding:8px 16px;font:inherit;font-weight:800;background:var(--bjgold);color:#1b1305;cursor:pointer}
.bjfams{display:flex;flex-wrap:wrap;gap:8px}
.bjfam{display:flex;flex-direction:column;align-items:center;gap:3px;width:74px;padding:8px 4px;border-radius:12px;border:1px solid var(--bjline);background:rgba(255,255,255,.05);font:inherit;font-size:13px;font-weight:700;color:var(--bjtext);cursor:pointer}
.bjfam small{font-size:11px;color:var(--bjgold)}
.bjfam:disabled{opacity:.55;cursor:default}
.bjlobby{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bjpl{display:flex;flex-direction:column;align-items:center;gap:3px;background:rgba(255,255,255,.05);border-radius:12px;padding:8px 2px;font-weight:700;font-size:12.5px;text-align:center}
.bjpl.empty{opacity:.35;font-weight:600}
.bjrules summary{font-weight:800;cursor:pointer;font-size:17px;color:var(--bjgold)}
.bjrules p,.bjrules li{line-height:1.65;color:#d4ddd8;margin:0;max-width:65ch}
.bjrules ol,.bjrules ul{margin:8px 0 0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.bjempty{text-align:center;color:#fff;opacity:.85;padding:6px}
.bjres{text-align:center;font-weight:700;line-height:1.6}
.bjres b{color:var(--bjgold)}
@media (prefers-reduced-motion:reduce){.bjcard.new{animation:none}}
/* בלי הפס הכחול העליון במשחקים, כדי שלא יפריע */
header.bar{display:none}body{padding-top:10px}
</style>
</head>
<body>
<main id="bjm"><p class="bjempty">טוען...</p></main>
<script type="module" src="js/bjpage.js"></script>
</body>
</html>
