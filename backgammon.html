<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הבית שלנו | שש בש</title>
<meta name="theme-color" content="#0f141b">
<meta name="color-scheme" content="only light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="js/splash.js"></script>
<link rel="stylesheet" href="css/style.css">
<style>
/* כל הכיתות של שש בש מתחילות ב-bg כדי לא להתנגש בעיצוב של שאר האפליקציה */
:root{--bgnight:#0f141b;--bgframe:#3a2418;--bgframe2:#5a3a26;--bgbrass:#e2b552;--bgivory:#f3ead3;--bgebony:#2a2420;--bgtext:#eee8d8;--bgmuted:#a9a08d;--bgpanel:#1a222c;--bgline:#2c3745;--bghl:rgba(226,181,82,.55)}
body{background:radial-gradient(120% 50% at 50% -10%,#24344a,transparent 60%),var(--bgnight) fixed;background-color:var(--bgnight)}
#bgm{max-width:460px;margin:0 auto;padding:0 12px 24px;display:flex;flex-direction:column;gap:12px;color:var(--bgtext)}
#bgm *{box-sizing:border-box}
.bgcard{background:var(--bgpanel);border:1px solid var(--bgline);border-radius:18px;padding:12px;color:var(--bgtext)}
.bgcard h2,.bgcard h3{margin:0 0 8px;font-size:16px;color:var(--bgbrass);display:flex;align-items:center;justify-content:space-between;gap:8px}
.bgpick{display:flex;flex-wrap:wrap;gap:10px}
.bgp{display:flex;flex-direction:column;align-items:center;gap:4px;width:68px;background:none;border:0;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:inherit;padding:4px;border-radius:12px}
.bgp:active{background:#2c3745}
.bgrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--bgline);text-decoration:none;color:inherit}
.bgrow:first-of-type{border-top:0}
.bgrow b{flex:1}
.bgtag{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:#2c3745;color:#cdd6e2}
.bgtag.me{background:var(--bgbrass);color:#1b1305}
.bgbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:16px;background:rgba(255,255,255,.07);font-weight:800}
.bgbar .sp{margin-inline-start:auto;font-size:13px;color:var(--bgmuted);font-weight:600}
.bgbanner{border-radius:16px;padding:12px 14px;text-align:center;font-weight:800;font-size:17px;min-height:50px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.07);line-height:1.4}
.bgbanner.you{background:var(--bgbrass);color:#1b1305}
.bgbanner.boom{background:#9b3a2c;color:#fff}
.bgframe{background:linear-gradient(160deg,var(--bgframe2),var(--bgframe));border-radius:16px;padding:8px;box-shadow:0 10px 28px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.08)}
.bgframe svg{display:block;width:100%;height:auto;border-radius:8px;direction:ltr;touch-action:manipulation}
.bgsides{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--bgmuted)}
.bgsides i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-inline-end:6px;vertical-align:-1px}
.bgdice{display:flex;justify-content:center;gap:12px;min-height:52px;align-items:center;flex-wrap:wrap}
.bgdie{width:46px;height:46px;border-radius:10px;background:var(--bgivory);box-shadow:0 3px 6px rgba(0,0,0,.45);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:6px;direction:ltr}
.bgdie b{width:9px;height:9px;border-radius:50%;background:#1b1b1b;place-self:center}
.bgdie.used{opacity:.3}
.bgdie.new{animation:bgroll .35s ease-out}
@keyframes bgroll{0%{transform:rotate(-90deg) scale(.6)}100%{transform:none}}
.bgbtns{display:flex;gap:10px;flex-wrap:wrap}
.bgbtn{flex:1;min-width:110px;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:800;font-size:17px;cursor:pointer;background:var(--bgbrass);color:#1b1305;text-align:center;text-decoration:none}
.bgbtn.g{background:#2c3745;color:var(--bgtext);font-size:15px;padding:12px}
.bgbtn.r{background:#8f3326;color:#fff;font-size:15px;padding:12px}
.bgbtn:disabled{opacity:.35}
.bgoff{display:flex;gap:10px}
.bgtray{flex:1;min-height:40px;border-radius:10px;background:rgba(0,0,0,.28);border:1.5px dashed var(--bgline);display:flex;align-items:center;gap:2px;padding:4px 8px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--bgmuted)}
.bgtray i{width:10px;height:22px;border-radius:3px;display:inline-block}
.bgtray.can{border-color:var(--bgbrass);background:rgba(226,181,82,.18);color:var(--bgtext);animation:bgglow 1s infinite alternate;cursor:pointer}
@keyframes bgglow{to{box-shadow:0 0 14px var(--bghl)}}
.bgover{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:60;padding:20px}
.bgbox{background:var(--bgpanel);border:2px solid var(--bgbrass);border-radius:24px;padding:24px 22px;text-align:center;max-width:340px;width:100%}
.bgbox h2{margin:6px 0;font-size:30px;color:var(--bgbrass)}
.bgbox p{margin:0 0 14px;color:var(--bgmuted);font-weight:600}
.bgbig{font-size:56px;line-height:1}
.bgconf{position:fixed;top:-12px;width:10px;height:14px;z-index:70;pointer-events:none;animation:bgfall linear forwards}
@keyframes bgfall{to{transform:translateY(110vh) rotate(720deg)}}
.bgrules summary{font-weight:800;cursor:pointer;font-size:16px;color:var(--bgbrass)}
.bgrules h4{margin:12px 0 4px;font-size:15px;color:var(--bgtext)}
.bgrules ul,.bgrules ol{margin:0;padding-inline-start:20px;display:grid;gap:6px;font-size:14.5px;line-height:1.6;color:#d8d1c0}
.bgrules p{margin:8px 0 0;line-height:1.6;font-size:14.5px;color:#d8d1c0}
.bgempty{text-align:center;color:var(--bgmuted);padding:6px}
.bgmsg{text-align:center;font-weight:800;font-size:16px}
@media (prefers-reduced-motion:reduce){.bgdie.new,.bgtray.can{animation:none}}
/* בלי הפס הכחול העליון במשחקים, כדי שלא יפריע */
header.bar{display:none}body{padding-top:10px}
</style>
</head>
<body>
<main id="bgm"><p class="bgempty">טוען...</p></main>
<script type="module" src="js/bgpage.js"></script>
</body>
</html>
