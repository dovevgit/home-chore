<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הבית שלנו | Royal Front</title>
<meta name="theme-color" content="#0D6EFD">
<meta name="color-scheme" content="only light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="js/splash.js"></script>
<link rel="stylesheet" href="css/style.css">
<style>
/* כל הכיתות של סטרטגו מתחילות ב-st- כדי לא להתנגש בעיצוב של שאר האפליקציה */
:root{--st-panel:#ffffff;--st-ink:#1b2a2f;--st-muted:#5a6d72;--st-line:#cfdcd8;--st-accent:#c98a00;--st-accent-ink:#241800;
  --st-mine:#2c6bd6;--st-mine-d:#1c4aa0;--st-foe:#cc3a2e;--st-foe-d:#8f2219;--st-foe-hidden:#7f2a24;--st-sel:#ffd23f;
  --st-font-display:'Assistant',system-ui,sans-serif}
body{background:radial-gradient(120% 60% at 50% -10%,#4d7a3a,transparent 60%),linear-gradient(180deg,#2c4a2a,#13220f 80%) fixed;background-color:#13220f}
[hidden]{display:none!important}
.st-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--st-panel);border:1px solid var(--st-line);border-radius:14px;padding:10px 14px}
.st-statusold{font-weight:800;min-width:0}
.st-count{display:flex;gap:10px;font-weight:700;font-size:14px;white-space:nowrap}
.st-count b{display:inline-flex;align-items:center;gap:5px}
.st-count i{width:12px;height:12px;border-radius:4px;display:inline-block}
.st-count .st-m i{background:var(--st-mine)}.st-count .st-f i{background:var(--st-foe)}
.st-board{direction:ltr;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));gap:2px;padding:5px;border-radius:14px;background:#5d8a3a url(stratego-bg.jpg) center/cover no-repeat;aspect-ratio:1;width:100%;box-shadow:0 6px 20px rgba(0,0,0,.25);overflow:hidden}
.st-cell{position:relative;border:0;padding:0;margin:0;border-radius:6px;background:transparent;box-shadow:inset 0 0 0 1px rgba(20,50,10,.28);cursor:pointer;display:grid;place-items:center;min-width:0;min-height:0;font:inherit}
.st-cell.st-alt{background:rgba(255,255,255,.07)}
.st-cell.st-lake{background:transparent;box-shadow:none;cursor:default}
.st-lakeimg{position:absolute;left:-1px;top:-1px;width:calc(200% + 4px);height:calc(200% + 4px);z-index:1;pointer-events:none}
.st-lakeimg svg{width:100%;height:100%;overflow:visible;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.st-rip{animation:strip 5s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes strip{0%{transform:scale(.25);opacity:.55}100%{transform:scale(1.1);opacity:0}}
@media (prefers-reduced-motion:reduce){.st-rip{animation:none;opacity:.2}}
.st-ready{display:flex;gap:8px;flex-wrap:wrap}
.st-ready span{flex:1;min-width:140px;background:var(--st-panel);border:1px solid var(--st-line);border-radius:12px;padding:7px 12px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.st-dot{width:10px;height:10px;border-radius:50%;background:#e0a21a;flex:none;display:inline-block}
.st-dot.st-ok{background:#2fa65a}
.st-btn:disabled{opacity:.5;cursor:default}
.st-cell:focus-visible{outline:3px solid var(--st-sel);outline-offset:-2px;z-index:2}
.st-cell.st-sel{outline:3px solid var(--st-sel);outline-offset:-3px;z-index:2}
.st-cell.st-tgt::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 0 2px rgba(0,0,0,.15)}
.st-cell.st-atk{box-shadow:inset 0 0 0 3px #ff4d3d,0 0 0 1px rgba(0,0,0,.2)}
.st-cell.st-atk::after{display:none}
.st-cell.st-last{box-shadow:inset 0 0 0 2px rgba(255,255,255,.85)}
.st-piece{width:88%;height:88%;border-radius:7px;display:grid;place-items:center;color:#fff;font-family:var(--st-font-display);font-size:clamp(13px,4.8vw,21px);line-height:1;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.st-piece.st-p{background:linear-gradient(160deg,var(--st-mine),var(--st-mine-d));border:2px solid #0f2f6e}
.st-piece.st-e{background:linear-gradient(160deg,var(--st-foe),var(--st-foe-d));border:2px solid #5e120c}
.st-piece.st-e.st-hid{background:repeating-linear-gradient(45deg,var(--st-foe-hidden) 0 5px,#6a211c 5px 10px)}
.st-piece.st-e.st-hid.st-peek svg,.st-piece.st-e.st-hid.st-peek .st-rk{opacity:.55}
.st-piece{position:relative}
.st-piece svg{width:80%;height:80%;display:block;filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
.st-rk{position:absolute;top:1px;left:3px;font:800 9px/1 var(--st-font-body);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.7)}
.st-mini{display:inline-grid;width:40px;height:40px;vertical-align:middle}
.st-mini.st-piece{width:40px;height:40px}
.st-lostrow{display:flex;align-items:center;gap:8px;padding-block:4px}
.st-lh{width:44px;font-weight:800;font-size:13px;color:var(--st-muted);flex:none}
.st-lost{display:flex;flex-wrap:wrap;gap:7px;min-height:36px;align-items:center;min-width:0}
.st-lostc{position:relative;display:inline-grid}
.st-lostc .st-mini,.st-lostc .st-mini.st-piece{width:32px;height:32px}
.st-lostc b{position:absolute;bottom:-5px;right:-5px;background:var(--st-ink);color:var(--st-bg);font-size:11px;border-radius:99px;min-width:16px;height:16px;line-height:16px;text-align:center;padding-inline:3px}
.st-lost em{color:var(--st-muted);font-size:13px;font-style:normal}
.st-shake{animation:stshake .38s ease-in-out}
@keyframes stshake{0%,100%{transform:translate(0,0)}15%{transform:translate(-5px,3px)}35%{transform:translate(5px,-3px)}55%{transform:translate(-3px,-2px)}75%{transform:translate(3px,2px)}}
@media (prefers-reduced-motion:reduce){.st-shake{animation:none}}
.st-splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#0d1a10;cursor:pointer;opacity:1;transition:opacity .6s ease;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.st-splash.st-out{opacity:0;pointer-events:none}
.st-sp-art{position:absolute;inset:0;overflow:hidden;background:#0b0f1a}
.st-sp-art::before{content:"";position:absolute;inset:-30px;background:url(stratego-splash.jpg) center/cover no-repeat;filter:blur(22px) brightness(.8);transform:scale(1.1)}
.st-sp-art::after{content:"";position:absolute;inset:0;background:url(stratego-splash.jpg) center/contain no-repeat;animation:stspin 1.1s ease-out both}
@keyframes stspin{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.st-sp-body{position:relative;text-align:center;color:#fff;padding:24px}
.st-sp-title{font-family:var(--st-font-display);font-size:clamp(54px,18vw,92px);line-height:1;margin:0;color:#ffd23f;-webkit-text-stroke:6px #4a3300;paint-order:stroke fill;text-shadow:0 6px 0 rgba(0,0,0,.35),0 0 30px rgba(255,210,63,.35)}
.st-sp-sub{font-weight:800;font-size:20px;margin:10px 0 0;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.st-sp-skip{position:absolute;bottom:max(18px,env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-size:14px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.9)}
@media (prefers-reduced-motion:reduce){.st-sp-art::after{animation:none}.st-splash{transition:none}}
.st-ico-in{display:flex;align-items:center;gap:12px}
.st-ico-in .st-piece{flex:none;width:52px;height:52px}
.st-ico-in .st-txt{min-width:0}
.st-piece.st-moved-in{animation:stpop .22s ease-out}
.st-piece.st-hit{animation:sthit .5s ease-out}
@keyframes stpop{from{transform:scale(.7)}to{transform:scale(1)}}
@keyframes sthit{0%{transform:scale(1.25);filter:brightness(1.6)}100%{transform:scale(1);filter:none}}
@media (prefers-reduced-motion:reduce){.st-piece.st-moved-in,.st-piece.st-hit{animation:none}}
.st-info{background:var(--st-panel);border:1px solid var(--st-line);border-radius:14px;padding:10px 14px;min-height:62px}
.st-info b{font-weight:800}
.st-info small{display:block;color:var(--st-muted);margin-top:2px}
.st-btns{display:flex;gap:10px;flex-wrap:wrap}
.st-btn{flex:1;min-width:120px;font:inherit;font-weight:800;font-size:17px;border:0;border-radius:14px;padding:12px 14px;background:var(--st-accent);color:var(--st-accent-ink);cursor:pointer}
.st-btn.st-sec{background:var(--st-panel);color:var(--st-ink);border:2px solid var(--st-line)}
.st-btn:focus-visible,summary:focus-visible{outline:3px solid var(--st-sel);outline-offset:2px}
.st-toggle{display:flex;align-items:center;gap:8px;color:var(--st-muted);font-size:14px;font-weight:600}
.st-toggle input{width:20px;height:20px;accent-color:var(--st-accent)}
#st h2{font-size:17px;margin:0 0 6px}
.st-panel{background:var(--st-panel);border:1px solid var(--st-line);border-radius:14px;padding:12px 14px}
.st-log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.st-log li{padding-block:3px;border-top:1px solid var(--st-line)}
.st-log li:first-child{border-top:0;font-weight:700}
details.st-panel summary{font-weight:800;cursor:pointer;font-size:17px}
.st-legend{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
.st-legend th,.st-legend td{text-align:start;padding:5px 6px;border-top:1px solid var(--st-line);vertical-align:top}
.st-legend td:nth-child(1),.st-legend td:nth-child(2),.st-legend td:nth-child(3){font-variant-numeric:tabular-nums;white-space:nowrap}
.st-legend td{vertical-align:middle}
.st-rules{margin:8px 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px;max-width:65ch}
.st-note{color:var(--st-muted);font-size:13px;margin:0}

#st{max-width:480px;margin:0 auto;padding:0 12px 28px;display:flex;flex-direction:column;gap:12px;color:#fff}
#st *,.st-splash *{box-sizing:border-box}
.st-bar,.st-info,.st-panel,.st-ready span{color:var(--st-ink)}
.st-oppbar{background:rgba(255,255,255,.14);border:0;color:#fff;font-weight:800;justify-content:flex-start}
.st-oppbar>span:first-child{display:flex;align-items:center;gap:10px}
.st-oppsub{margin-inline-start:auto;font-size:13px;opacity:.85;font-weight:600}
.st-banner{border-radius:16px;padding:12px 14px;text-align:center;font-weight:800;font-size:18px;min-height:50px;display:flex;align-items:center;justify-content:center}
.st-banner.st-you{background:#ffd23f;color:#3a2800;box-shadow:0 4px 0 #c99200}
.st-banner.st-them{background:rgba(255,255,255,.18);color:#fff}
.st-banner.st-end{background:#fff;color:var(--st-ink)}
.st-btn{text-align:center;text-decoration:none;display:block}
.st-btn.st-go{background:#2fa65a;color:#fff}
.st-btn.st-red{background:#ff6b6b;color:#fff}
.st-thanks{text-align:center;font-weight:800;font-size:16px;color:#fff;margin:0;width:100%}
.st-empty{text-align:center;color:#fff;opacity:.85;padding:6px}
.st-hero{text-align:center;padding:6px 0}
.st-herotitle{font-family:var(--st-font-display);font-size:46px;font-weight:800;line-height:1.05;color:#ffd23f;-webkit-text-stroke:5px #4a3300;paint-order:stroke fill;text-shadow:0 5px 0 rgba(0,0,0,.35)}
.st-herosub{margin-top:6px;font-weight:700;opacity:.9}
.st-card{background:rgba(255,255,255,.95);border-radius:20px;padding:12px;box-shadow:0 6px 18px rgba(0,0,0,.25);color:var(--st-ink)}
.st-card h3{margin:0 0 8px;font-size:16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.st-pick{display:flex;flex-wrap:wrap;gap:10px}
.st-pk{display:flex;flex-direction:column;align-items:center;gap:4px;width:68px;background:none;border:0;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:inherit;padding:4px;border-radius:14px}
.st-pk:active{background:#EEF3FF}
.st-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid #EEF2FA;text-decoration:none;color:inherit}
.st-row:first-of-type{border-top:0}
.st-row b{flex:1}
.st-tag2{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:#EEF3FF;color:#3B4FA0}
.st-tag2.me{background:#FF7A1A;color:#fff}
.st-known::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:#ffd23f;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.st-btn.st-red{border:0}
.st-over{position:fixed;inset:0;background:rgba(10,24,8,.82);display:grid;place-items:center;z-index:60;padding:20px}
.st-box{background:#fff;border-radius:26px;padding:26px 22px;text-align:center;max-width:340px;width:100%;color:var(--st-ink)}
.st-box h2{margin:6px 0;font-size:32px}
.st-box p{margin:0 0 14px;color:var(--st-muted);font-weight:600}
.st-big{font-size:60px;line-height:1}
.st-conf{position:fixed;top:-12px;width:10px;height:14px;z-index:70;pointer-events:none;animation:stfall linear forwards}
@keyframes stfall{to{transform:translateY(110vh) rotate(720deg)}}
.st-toggle{color:#e8f2e0}
.st-ready span{background:var(--st-panel)}
.st-statusold{display:none}

/* בלי הפס הכחול העליון במשחקים, כדי שלא יפריע */
header.bar{display:none}body{padding-top:10px}
.gback{display:block;max-width:480px;margin:0 auto;padding:4px 14px 8px;font:inherit;font-size:15px;font-weight:800;color:#cfe3c4;text-decoration:none}
</style>
</head>

<a class="gback" id="gback" href="games.html">‹ חזרה למשחקים</a>

</html>
