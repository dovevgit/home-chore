<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הבית שלנו | פרטי משימה</title>
<meta name="theme-color" content="#0D6EFD">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="main"><p class="empty">טוען...</p></main>
<script type="module">
import { initPage, supabase, esc, icon, iconBox, avatar, ilTime, ilDate, reportCounts, deriveStatus, nextSlot, STATUS } from './js/common.js';
const { profiles } = await initPage({ title: 'פרטי משימה', back: 'tasks.html' });
const byId = Object.fromEntries(profiles.map(p => [p.id, p]));
const id = new URLSearchParams(location.search).get('id');
const main = document.getElementById('main');
const { data: t } = id ? await supabase.from('tasks').select('*').eq('id', id).maybeSingle() : { data: null };
if (!t) { main.innerHTML = '<p class="empty">המשימה לא נמצאה</p>'; }
else {
  const c = (await reportCounts([t.id]))[t.id] || 0;
  const status = deriveStatus(t, c);
  const S = STATUS[status];
  const slot = nextSlot(t, c);
  const repeatTxt = t.repeat === 'weekly' ? 'שבועי' : t.repeat === 'daily' ? (t.times_required > 1 ? `${t.times_required} פעמים ביום` : 'פעם ביום') : 'חד-פעמי';
  const due = slot?.due_at ? `${ilDate(new Date(slot.due_at)) === ilDate(new Date()) ? 'היום' : ilDate(new Date(slot.due_at))} בשעה <span dir="ltr">${ilTime(new Date(slot.due_at))}</span>` : '—';
  document.title = 'הבית שלנו | ' + t.title;
  main.innerHTML = `
    <div class="back-row">${iconBox(t, 56)}<div style="flex:1"><div style="font-size:24px;font-weight:800">${esc(t.title)}</div>
      <span class="chip ${S.cls}">${icon(S.icon, 14)} ${S.label}</span></div></div>
    <div class="card flat">
      <div class="kv"><span>אחראי/ת</span><span>${slot ? `${avatar(byId[slot.assignee_id], 28)} ${esc(byId[slot.assignee_id]?.name || '')}` : '—'}</span></div>
      <div class="kv"><span>מועד</span><span>${due}</span></div>
      <div class="kv"><span>חזרה</span><span>${esc(repeatTxt)}${t.times_required > 1 ? ` <span dir="ltr">(${c}/${t.times_required})</span>` : ''}</span></div>
      <div class="kv"><span>נקודות</span><span class="pts" dir="ltr">+${t.points}</span></div>
      <div class="kv"><span>חובה לצלם</span><span>${t.requires_photo ? 'כן' : 'לא'}</span></div>
    </div>
    ${t.description ? `<div class="card flat"><h3>תיאור</h3><p>${esc(t.description)}</p></div>` : ''}
    ${t.tips ? `<div class="card flat"><h3>טיפים</h3><p>${esc(t.tips)}</p></div>` : ''}
    <button class="btn disabled" type="button" disabled>${status === 'done' ? 'כל החזרות בוצעו' : 'ביצעתי את המשימה'}</button>
    ${status === 'done' ? '' : '<p class="note">הדיווח על ביצוע ייפתח בשלב הבא של הפיתוח.</p>'}`;
}
</script>
</body>
</html>
