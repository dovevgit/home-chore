<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הבית שלנו | הודעה חשובה</title>
<meta name="theme-color" content="#0D6EFD">
<meta name="color-scheme" content="only light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="js/splash.js"></script>
<link rel="stylesheet" href="css/style.css">
<style>
.xbox{background:#FFF7ED;border:4px solid #FF8A00;border-radius:22px;padding:14px;margin-bottom:14px}
.xbox h2{margin:0 0 4px;color:#9A3412;font-size:20px}
.xbox .hint{color:#C2410C;font-size:14px;margin:0 0 10px}
.xwho{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.wchip{display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid #FFD2A1;background:#fff;border-radius:16px;padding:8px 10px;min-width:72px;cursor:pointer;font-family:inherit;font-weight:700;color:#7C2D12;font-size:15px}
.wchip.on{border-color:#F97316;background:#FFE7CC;box-shadow:0 0 0 3px rgba(249,115,22,.25)}
.wchip .tick{height:18px;font-size:16px;color:#F97316}
.xbox textarea{width:100%;box-sizing:border-box;min-height:100px;border:3px solid #FFC078;border-radius:16px;padding:10px;font-size:18px;font-family:inherit;resize:none;background:#fff}
.xbox textarea:focus{outline:none;border-color:#FF8A00}
.itools{display:flex;gap:8px;margin:8px 0;align-items:center}
.itool{border:2px solid #FFC078;background:#fff;color:#C2410C;border-radius:14px;padding:8px 12px;font-weight:700;font-size:15px;font-family:inherit;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.ipv{position:relative;display:inline-block}.ipv img{width:70px;height:70px;object-fit:cover;border-radius:12px;border:2px solid #FFC078}
.ipv button{position:absolute;top:-8px;inset-inline-end:-8px;width:26px;height:26px;border-radius:50%;border:0;background:#C2410C;color:#fff;font-size:16px;line-height:1;cursor:pointer}
.obtn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font-weight:800;font-size:19px;font-family:inherit;color:#fff;background:linear-gradient(135deg,#FF9F1C,#F97316);box-shadow:0 5px 0 #C2410C;cursor:pointer}
.obtn:active{transform:translateY(3px);box-shadow:0 2px 0 #C2410C}.obtn:disabled{opacity:.6}
.mrow{background:#fff;border:2px solid #FFD2A1;border-radius:18px;padding:10px 12px;margin-bottom:10px}
.mrow .xmh{display:flex;align-items:center;gap:8px;margin-bottom:6px}.mrow .xmh b{color:#9A3412}.mrow .xmh small{color:#B45309;margin-inline-start:auto}
.mrow p{margin:0 0 6px;font-size:17px;white-space:pre-wrap;word-break:break-word}
.mrow img.mi{display:block;max-width:100%;max-height:200px;border-radius:12px;margin-bottom:6px;cursor:zoom-in}
.st{display:flex;flex-wrap:wrap;gap:6px}
.st span{font-size:14px;font-weight:700;border-radius:999px;padding:3px 10px;background:#FFE7CC;color:#9A3412}
.st span.ok{background:#DCFCE7;color:#166534}
.mdel{border:0;background:none;color:#B91C1C;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;padding:4px 0}
.kinds{display:flex;gap:8px;margin:6px 0 10px}
.kbtn{flex:1;border:3px solid #FFD2A1;background:#fff;color:#7C2D12;border-radius:14px;padding:10px;font-weight:800;font-size:16px;font-family:inherit;cursor:pointer}
.kbtn.on{border-color:#F97316;background:#FFE7CC}
.irow{display:flex;gap:8px;margin-bottom:8px}
.irow input{flex:1;min-width:0;border:3px solid #FFC078;border-radius:14px;padding:10px;font-size:18px;font-family:inherit;background:#fff}
.irow input:focus{outline:none;border-color:#FF8A00}
.irow button{flex:none;width:44px;border:0;border-radius:12px;background:#FFE0E0;color:#B91C1C;font-size:22px;cursor:pointer}
.addrow{border:2px dashed #FF8A00;background:#fff;color:#C2410C;border-radius:14px;padding:10px;font-weight:800;font-size:16px;font-family:inherit;width:100%;cursor:pointer;margin-bottom:8px}
.xlist{margin:4px 0 8px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.xlist label{display:flex;align-items:center;gap:10px;margin:0;line-height:1.25;min-height:0;font-weight:600;background:#FFF7ED;border:2px solid #FFD2A1;border-radius:12px;padding:8px 10px;font-size:17px}
.xlist input{width:22px;height:22px;accent-color:#F97316;flex:none}
.xlist input:checked+span{text-decoration:line-through;color:#9CA3AF}
.xbtn{border:0;background:none;color:#C2410C;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;padding:4px 0;margin-inline-end:14px}
.zoomov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:10px}
.zoomov img{max-width:100%;max-height:100%;border-radius:12px}
</style>
</head>
<body>
<main>
  <div class="sec-title" style="margin-top:0">שמורות</div>
  <div id="demoSaved"></div>
  <div id="saved"><p class="empty">אין הודעות שמורות</p></div>
  <div class="xbox">
    <h2>הודעה חשובה</h2>
    <p class="hint">ההודעה תקפוץ אצל מי שבחרתם בחלונית גדולה, עד שיענו לה.</p>
    <div class="sec-title" style="margin:6px 0 0">למי לשלוח?</div>
    <div class="xwho" id="who"></div>
    <div class="kinds"><button type="button" class="kbtn on" id="kMsg">הודעה</button><button type="button" class="kbtn" id="kList">רשימת קניות</button></div>
    <textarea id="text" maxlength="1000" placeholder="כתבו את ההודעה..."></textarea>
    <div class="itools" id="tools">
      <button class="itool" id="cam" type="button"></button>
      <button class="itool" id="gal" type="button"></button>
      <span id="pv"></span>
    </div>
    <input type="file" id="fc" accept="image/*" capture="environment" hidden>
    <input type="file" id="fg" accept="image/*" hidden>
    <button class="obtn" id="send" type="button">שליחה</button>
  </div>
  <div class="xbox" id="pvBox" hidden>
    <h2>תצוגה מקדימה (מנהלים)</h2>
    <p class="hint">מראה איך החלונית נראית אצל הנמענים, על גבי דף הבית כמו הודעה אמיתית. לא נשלח ולא נשמר כלום.</p>
    <select id="pvSender" style="width:100%;padding:12px;font-size:17px;font-family:inherit;border:3px solid #FFC078;border-radius:14px;background:#fff;margin-bottom:8px"></select>
    <label style="display:flex;align-items:center;gap:8px;margin:6px 0 10px;font-weight:700;color:#7C2D12"><input type="checkbox" id="pvTwo"> הצג גם הודעה משולח נוסף</label>
    <button class="obtn" id="pvGo" type="button">הצג לי איך זה נראה</button>
    <button class="obtn" id="pvSound" type="button" style="margin-top:10px;background:#fff;color:#C2410C;border:3px solid #FF8A00;box-shadow:none;font-size:17px">🔔 השמע צליל הודעה</button>
    <button class="obtn" id="pvPush" type="button" style="margin-top:10px;background:#fff;color:#C2410C;border:3px solid #FF8A00;box-shadow:none;font-size:17px">📲 שלח לי התראת בדיקה לטלפון</button>
    <button class="obtn" id="pvSaved" type="button" style="margin-top:10px;background:#fff;color:#C2410C;border:3px solid #FF8A00;box-shadow:none;font-size:17px">הצג איך נראית הודעה שמורה</button>
  </div>
  <div class="sec-title">ההודעות ששלחתי</div>
  <div id="sent"><p class="empty">טוען...</p></div>
  <div class="sec-title">הודעות שקיבלתי</div>
  <div id="got"><p class="empty">טוען...</p></div>
</main>
<script type="module">
import { initPage, supabase, esc, icon, avatar, signedUrls, shrinkImage, showToast, playChime } from './js/common.js';
import { sendTestPush, pushState } from './js/push.js';
import { impWhen } from './js/important.js';
const { me, profiles, isAdmin } = await initPage({ active: 'important', title: 'הודעה חשובה', back: 'index.html' });
const $ = id => document.getElementById(id);
const byId = Object.fromEntries(profiles.map(p => [p.id, p]));
const others = profiles.filter(p => p.is_user !== false && p.id !== me?.id);
let sel = new Set(), blob = null, blobUrl = null, busy = false, kind = 'message';
$('cam').innerHTML = icon('camera', 20) + ' צילום'; $('gal').innerHTML = icon('image', 20) + ' תמונה';
supabase.rpc('purge_important').then(() => {}, () => {});

function drawWho() {
  const all = others.length > 0 && others.every(p => sel.has(p.id));
  $('who').innerHTML = `<button type="button" class="wchip ${all ? 'on' : ''}" data-all="1"><span style="font-size:30px;line-height:42px">👨‍👩‍👧‍👦</span>כולם<span class="tick">${all ? '✓' : ''}</span></button>` +
    others.map(p => `<button type="button" class="wchip ${sel.has(p.id) ? 'on' : ''}" data-id="${p.id}">${avatar(p, 42)}${esc(p.name)}<span class="tick">${sel.has(p.id) ? '✓' : ''}</span></button>`).join('');
}
$('who').addEventListener('click', e => {
  const b = e.target.closest('.wchip'); if (!b) return;
  if (b.dataset.all) { const all = others.every(p => sel.has(p.id)); sel = new Set(all ? [] : others.map(p => p.id)); }
  else { const id = b.dataset.id; sel.has(id) ? sel.delete(id) : sel.add(id); }
  drawWho();
});
const drawPv = () => { $('pv').innerHTML = blobUrl ? `<span class="ipv"><img src="${blobUrl}" alt=""><button type="button" id="rm" aria-label="הסרה">×</button></span>` : ''; $('rm')?.addEventListener('click', () => { blob = null; blobUrl = null; drawPv(); }); };
function setKind(k) {
  kind = k; $('kMsg').classList.toggle('on', k === 'message'); $('kList').classList.toggle('on', k === 'list');
  $('tools').hidden = k === 'list';
  $('text').maxLength = k === 'list' ? 2000 : 1000;
  $('text').placeholder = k === 'list' ? 'כתבו את הרשימה, כל פריט בשורה חדשה...' : 'כתבו את ההודעה...';
  $('text').style.minHeight = k === 'list' ? '170px' : '';
}
$('kMsg').onclick = () => setKind('message'); $('kList').onclick = () => setKind('list');
$('cam').onclick = () => $('fc').click(); $('gal').onclick = () => $('fg').click();
for (const id of ['fc', 'fg']) $(id).addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { blob = await shrinkImage(f); blobUrl = URL.createObjectURL(blob); drawPv(); } catch (_) { showToast('התמונה לא נטענה', true); }
});
$('send').onclick = async () => {
  if (busy) return;
  const txt = $('text').value.trim();
  if (!sel.size) { showToast('בחרו למי לשלוח', true); return; }
  const items = kind === 'list' ? txt.split('\n').map(x => x.trim()).filter(Boolean).slice(0, 60) : [];
  if (kind === 'list' && !items.length) { showToast('כתבו את הרשימה', true); return; }
  if (kind === 'message' && !txt && !blob) { showToast('כתבו הודעה או צרפו תמונה', true); return; }
  busy = true; $('send').disabled = true;
  try {
    let path = null;
    if (blob) {
      path = `reports/${me.id}/imp-${crypto.randomUUID()}.jpg`;
      const up = await supabase.storage.from('photos').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
      if (up.error) throw new Error('upload');
    }
    const r = await supabase.from('important_msgs').insert(kind === 'list' ? { to_users: [...sel], body: null, kind: 'list', items } : { to_users: [...sel], body: txt || null, photo_path: path });
    if (r.error) throw new Error('send');
    $('text').value = ''; blob = null; blobUrl = null; sel = new Set(); drawPv(); drawWho(); setKind(kind);
    showToast('ההודעה נשלחה'); await load();
  } catch (_) { showToast('השליחה נכשלה, נסו שוב', true); }
  busy = false; $('send').disabled = false;
};

const listUl = (m, checked, boxes) => m.kind === 'list' && Array.isArray(m.items)
  ? `<div class="xlist" data-m="${m.id}">${m.items.map((t, i) => boxes
      ? `<label><input type="checkbox" data-i="${i}" ${checked.includes(i) ? 'checked' : ''}><span>${esc(t)}</span></label>`
      : `<label><span>• ${esc(t)}</span></label>`).join('')}</div>` : '';
const row = (m, urls, extra, listHtml = '') => {
  const p = byId[m.sender_id];
  return `<div class="mrow"><div class="xmh">${avatar(p, 34)}<b>${esc(p?.name || 'מישהו')}</b><small>${impWhen(m.created_at)}</small></div>
    ${m.photo_path && urls[m.photo_path] ? `<img class="mi" src="${urls[m.photo_path]}" alt="תמונה">` : ''}
    ${m.body ? `<p>${esc(m.body)}</p>` : ''}${listHtml}${extra}</div>`;
};
const COLS = 'id,sender_id,to_users,body,photo_path,parent_id,kind,items,hidden_by,created_at';
const visible = m => !(m.hidden_by || []).includes(me.id);
async function load() {
  const { data, error } = await supabase.from('important_msgs').select(COLS).order('created_at', { ascending: false }).limit(40);
  if (error) { $('sent').innerHTML = '<p class="empty">לא הצלחנו לטעון</p>'; $('got').innerHTML = ''; return; }
  const all = (data || []).filter(visible);
  const myReads = ((await supabase.from('important_reads').select('msg_id,checked,saved').eq('user_id', me.id)).data || []);
  const savedReads = myReads.filter(r => r.saved);
  const have = new Set(all.map(m => m.id));
  const missing = savedReads.map(r => r.msg_id).filter(id => !have.has(id));
  const extra = missing.length ? ((await supabase.from('important_msgs').select(COLS).in('id', missing)).data || []).filter(visible) : [];
  const byMsg = Object.fromEntries([...all, ...extra].map(m => [m.id, m]));
  const sent = all.filter(m => m.sender_id === me.id).slice(0, 15);
  const got = all.filter(m => m.sender_id !== me.id).slice(0, 15);
  const savedSet = new Set(savedReads.map(r => r.msg_id));
  const urls = await signedUrls([...all, ...extra].map(m => m.photo_path));
  const reads = sent.length ? ((await supabase.from('important_reads').select('msg_id,user_id,opened_at,done').in('msg_id', sent.map(m => m.id))).data || []) : [];
  const savedMsgs = savedReads.map(r => byMsg[r.msg_id]).filter(Boolean).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  $('saved').innerHTML = savedMsgs.length ? savedMsgs.map(m => row(m, urls, `${m.sender_id !== me.id ? `<button class="xbtn" type="button" data-thread="${m.sender_id}">פתח שיחה</button>` : ''}<button class="xbtn" type="button" data-unsave="${m.id}">הסר מהשמורות</button>`, listUl(m, savedReads.find(r => r.msg_id === m.id)?.checked || [], true))).join('') : '<p class="empty">אין הודעות שמורות. בחלונית ההודעה יש כפתור "שמור אצלי"</p>';
  $('sent').innerHTML = sent.length ? sent.map(m => {
    const st = m.to_users.map(u => { const r = reads.find(x => x.msg_id === m.id && x.user_id === u); const n = esc(byId[u]?.name || '');
      return r ? `<span class="ok">${n} ✓ נקרא${r.done ? '' : ' (עוד לא ענה)'}</span>` : `<span>${n} · טרם נקרא</span>`; }).join('');
    return `<div class="mrow"><div class="xmh"><b>אל:</b><small style="margin-inline-start:0">${impWhen(m.created_at)}</small></div>
      ${m.photo_path && urls[m.photo_path] ? `<img class="mi" src="${urls[m.photo_path]}" alt="תמונה">` : ''}${m.body ? `<p>${esc(m.body)}</p>` : ''}${listUl(m, [], false)}
      <div class="st">${st}</div><button class="mdel" type="button" data-del="${m.id}">מחק לכולם</button></div>`;
  }).join('') : '<p class="empty">עוד לא שלחתם הודעות</p>';
  $('got').innerHTML = got.length ? got.map(m => row(m, urls, `<button class="xbtn" type="button" data-thread="${m.sender_id}">פתח שיחה</button><button class="xbtn" type="button" data-hide="${m.id}" style="color:#B91C1C">מחק</button>` + (savedSet.has(m.id) ? '<small style="color:#166534;font-weight:700">✓ שמור</small>' : `<button class="xbtn" type="button" data-save="${m.id}">שמור אצלי</button>`), listUl(m, [], false))).join('') : '<p class="empty">אין הודעות שהתקבלו</p>';
}
const setSaved = async (id, v) => { await supabase.from('important_reads').upsert({ msg_id: id, user_id: me.id, saved: v }, { onConflict: 'msg_id,user_id' }); load(); };
$('saved').addEventListener('change', e => {
  const box = e.target.closest('.xlist'); if (!box) return;
  const arr = [...box.querySelectorAll('input')].map((x, i) => x.checked ? i : -1).filter(i => i >= 0);
  supabase.from('important_reads').upsert({ msg_id: box.dataset.m, user_id: me.id, checked: arr }, { onConflict: 'msg_id,user_id' }).then(() => {}, () => {});
});
document.querySelector('main').addEventListener('click', async e => {
  const im = e.target.closest('img.mi');
  if (im) { const z = document.createElement('div'); z.className = 'zoomov'; z.innerHTML = `<img src="${im.src}" alt="">`; z.onclick = () => z.remove(); document.body.append(z); return; }
  const hd = e.target.closest('[data-hide]');
  if (hd) { if (confirm('למחוק את ההודעה אצלך? אצל הצד השני היא תישאר.')) { const r = await supabase.rpc('hide_important', { ids: [hd.dataset.hide] }); if (r.error) showToast('המחיקה נכשלה', true); else { showToast('ההודעה נמחקה'); load(); } } return; }
  const th = e.target.closest('[data-thread]'); if (th) { if (window.__imp) window.__imp.openThread(th.dataset.thread); else showToast('רגע, האפליקציה עדיין נטענת', true); return; }
  const sv = e.target.closest('[data-save]'); if (sv) { setSaved(sv.dataset.save, true); return; }
  const us = e.target.closest('[data-unsave]'); if (us) { setSaved(us.dataset.unsave, false); return; }
  const d = e.target.closest('[data-del]');
  if (d && confirm('למחוק את ההודעה אצל כולם, גם אצל מי שקיבל אותה?')) { await supabase.from('important_msgs').delete().eq('id', d.dataset.del); load(); }
});
if (isAdmin) {
  $('pvBox').hidden = false;
  $('pvSender').innerHTML = others.map(p => `<option value="${p.id}">שולח לדוגמה: ${esc(p.name)}</option>`).join('');
  $('pvSound').onclick = () => playChime();
  $('pvPush').onclick = async () => {
    const st = await pushState();
    if (st !== 'on') { showToast('קודם יש להפעיל התראות: בתפריט, "הפעל התראות"', true); return; }
    try { const r = await sendTestPush(); showToast(r?.sent ? 'נשלחה התראה, תראה אותה עוד רגע' : 'לא נמצא מכשיר שמחובר להתראות', !r?.sent); }
    catch (_) { showToast('השליחה נכשלה. בדקו שהפונקציה push פרוסה ב-Supabase', true); }
  };
  $('pvSaved').onclick = () => {
    const box = $('demoSaved');
    if (box.innerHTML) { box.innerHTML = ''; $('pvSaved').textContent = 'הצג איך נראית הודעה שמורה'; return; }
    const sid = $('pvSender').value, at = new Date().toISOString();
    const hide = '<button class="xbtn" type="button" onclick="document.getElementById(\'pvSaved\').click()">הסתר דוגמה</button>';
    box.innerHTML = '<p class="hint" style="color:#C2410C;font-weight:700;margin:0 0 6px">דוגמה בלבד, לא נשמר כלום:</p>'
      + row({ id: 'demo1', sender_id: sid, body: 'לא לשכוח: ביום חמישי יש חוג אצל נועה ב-17:00', kind: 'message', created_at: at }, {}, '<small style="color:#166534;font-weight:700">✓ שמור</small> ' + hide)
      + row({ id: 'demo2', sender_id: sid, body: null, kind: 'list', items: ['חלב', 'לחם', 'ביצים', 'עגבניות'], created_at: at }, {}, hide, listUl({ id: 'demo2', kind: 'list', items: ['חלב', 'לחם', 'ביצים', 'עגבניות'] }, [1], true));
    $('pvSaved').textContent = 'הסתר את הדוגמה';
    box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  $('pvGo').onclick = () => {
    const a = $('pvSender').value; const senders = [a];
    if ($('pvTwo').checked) { const b = others.find(p => p.id !== a); if (b) senders.push(b.id); }
    try { sessionStorage.setItem('impPreview', JSON.stringify({ senders })); } catch (_) {}
    location.href = 'index.html';
  };
}
drawWho(); drawPv();
await load();
</script>
</body>
</html>
