<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הבית שלנו | משימות</title>
<meta name="theme-color" content="#0D6EFD">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <div class="tabs" id="dayTabs">
    <button data-day="today" class="on">היום</button>
    <button data-day="tomorrow">מחר</button>
    <button data-day="week">השבוע</button>
  </div>
  <div class="filters">
    <select id="fMember" aria-label="בן משפחה"><option value="">כל המשפחה</option></select>
    <select id="fStatus" aria-label="סטטוס">
      <option value="">כל הסטטוסים</option><option value="waiting">ממתין</option><option value="progress">בתהליך</option>
      <option value="done">בוצע</option><option value="overdue">באיחור</option>
    </select>
  </div>
  <div id="list"><p class="empty">טוען...</p></div>
</main>
<script type="module">
import { initPage, supabase, esc, icon, iconBox, tintOf, avatar, ilDate, ilTime, addDays, weekStart, reportCounts, loadReports, deriveStatus, nextSlot, STATUS } from './js/common.js';
const { session, profiles } = await initPage({ active: 'tasks', title: 'המשימות שלנו' });
const byId = Object.fromEntries(profiles.map(p => [p.id, p]));

const fMember = document.getElementById('fMember'), fStatus = document.getElementById('fStatus');
profiles.filter(p => p.is_user).forEach(p => fMember.insertAdjacentHTML('beforeend', `<option value="${p.id}">${esc(p.name)}</option>`));
if (new URLSearchParams(location.search).get('me') === '1') fMember.value = session.user.id;

let day = 'today';
document.getElementById('dayTabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  day = b.dataset.day;
  document.querySelectorAll('#dayTabs button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
fMember.onchange = fStatus.onchange = () => render();

const ws = weekStart();
const since = addDays(ilDate(new Date()), -8);
const { data: tasks, error } = await supabase.from('tasks').select('*')
  .eq('kind', 'occurrence').eq('active', true).gte('occurrence_date', since);
const reports = error ? [] : await loadReports((tasks || []).map(t => t.id));
const counts = {}, lastBy = {};
for (const r of reports) { counts[r.task_id] = (counts[r.task_id] || 0) + 1; lastBy[r.task_id] = r.user_id; }

function inDay(t, which) {
  const today = ilDate(new Date());
  const slots = t.slots || [];
  if (which === 'week') {
    if (slots.length) return slots.some(s => s.due_at && new Date(s.due_at) >= ws.start && new Date(s.due_at) < ws.end);
    return t.occurrence_date >= ws.dateStr && t.occurrence_date < addDays(ws.dateStr, 7);
  }
  const target = which === 'today' ? today : addDays(today, 1);
  if (slots.length) return slots.some(s => s.due_at && ilDate(new Date(s.due_at)) === target);
  return t.occurrence_date === target;
}

function render() {
  const el = document.getElementById('list');
  if (error) { el.innerHTML = '<p class="empty">לא הצלחנו לטעון משימות</p>'; return; }
  const m = fMember.value, st = fStatus.value, now = new Date();
  const rows = (tasks || []).filter(t => inDay(t, day)).map(t => {
    const c = counts[t.id] || 0;
    return { t, c, status: deriveStatus(t, c, now), slot: nextSlot(t, c) };
  }).filter(r => (!m || (r.t.slots || []).some(s => s.assignee_id === m)) && (!st || r.status === st));
  rows.sort((a, b) => (b.status === 'overdue') - (a.status === 'overdue') ||
    (new Date(a.slot?.due_at || '2100-01-01')) - (new Date(b.slot?.due_at || '2100-01-01')));
  if (!rows.length) { el.innerHTML = '<p class="empty">אין משימות שמתאימות לסינון</p>'; return; }
  el.innerHTML = rows.map(({ t, c, status, slot }) => {
    const S = STATUS[status];
    const multi = t.times_required > 1;
    const due = slot?.due_at ? (multi && status !== 'done' ? `הבא: ${ilTime(new Date(slot.due_at))}` : ilTime(new Date(slot.due_at))) : '';
    return `<a class="tcard" href="task.html?id=${t.id}" style="background:${tintOf(t)}">
      <span class="sdot ${S.cls}">${status === 'done' ? icon('check', 14) : ''}</span>
      ${iconBox(t)}
      <div class="tmain"><b>${esc(t.title)}${multi ? ` <span dir="ltr">(${c}/${t.times_required})</span>` : ''}</b><small>${due ? `<span dir="ltr">${esc(due)}</span>` : ''}</small></div>
      <span class="chip ${S.cls}">${icon(S.icon === 'clock' ? 'hourglass' : S.icon, 13)} ${S.label}</span>
      ${avatar(byId[(status === 'done' || c > 0) ? lastBy[t.id] : slot?.assignee_id], 36)}</a>`;
  }).join('');
}
render();
</script>
</body>
</html>
