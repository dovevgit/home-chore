<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הבית שלנו | פתקים על המקרר</title>
<meta name="theme-color" content="#0D6EFD">
<meta name="color-scheme" content="only light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="js/splash.js"></script>
<link rel="stylesheet" href="css/style.css">
<style>
/* עיצוב הדף נמצא כאן כדי שלא יהיה תלוי בגרסת style.css */
.fridge{position:relative;overflow:hidden;height:calc(100dvh - 76px - env(safe-area-inset-top));background:linear-gradient(90deg,#CBD6E0,#EEF3F8 14%,#F7FAFC 50%,#EEF3F8 86%,#C3CFDA)}
.fridge .fz{position:absolute;inset-inline:0;top:30%;height:7px;background:linear-gradient(180deg,#9AA8B6,#C9D4DE);box-shadow:0 2px 4px rgba(31,41,55,.25)}
.fridge .hd{position:absolute;right:12px;width:14px;border-radius:8px;background:linear-gradient(90deg,#8C99A6,#E7EDF2 45%,#9AA7B3);box-shadow:0 2px 5px rgba(31,41,55,.35)}
.fridge .hd1{top:19%;height:9%}.fridge .hd2{top:40%;height:20%}
.fnote{position:absolute;width:34%;aspect-ratio:1;border:0;border-radius:3px 3px 8px 3px;padding:30px 8px 8px;font:inherit;text-align:start;cursor:pointer;box-shadow:0 5px 10px rgba(31,41,55,.28);display:flex;flex-direction:column;gap:2px;overflow:hidden;color:#1F2937}
.fnote .mg{position:absolute;top:6px;left:50%;margin-left:-8px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FF8A8A,#D62828);box-shadow:0 2px 3px rgba(0,0,0,.35)}
.fnote .fav{position:absolute;top:4px;inset-inline-start:5px;line-height:0}
.fnote .ftxt{font-size:14px;font-weight:700;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.fnote .ftxt.one{-webkit-line-clamp:1;font-size:12.5px}
.fnote .fdraw{width:100%;flex:1;min-height:0;object-fit:contain}
.fempty{position:absolute;inset-inline:0;top:42%;text-align:center;font-size:19px;font-weight:700;color:#6B7280;margin:0}
.fab{position:absolute;bottom:18px;inset-inline-start:18px;width:62px;height:62px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:38px;line-height:1;box-shadow:0 6px 14px rgba(13,110,253,.45);cursor:pointer}
.ncard{border-radius:12px;padding:14px;box-shadow:inset 0 0 0 1px rgba(31,41,55,.08)}
.ncard .nhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ncard .nhead small{display:block;color:#4B5563;font-weight:700}
.ncard .nbig{width:100%;display:block;border-radius:8px;background:rgba(255,255,255,.35)}
.ncard .nbody{font-size:20px;font-weight:700;line-height:1.4;margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
#pad{width:100%;aspect-ratio:1;display:block;touch-action:none;background:rgba(255,255,255,.55);border-radius:10px;border:2px dashed rgba(31,41,55,.25)}
.ptools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.pc{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(31,41,55,.3);cursor:pointer;padding:0}
.pc.big{width:40px;height:40px}
.pc.on{box-shadow:0 0 0 3px var(--blue)}
.pt{border:1.5px solid rgba(31,41,55,.3);background:#fff;border-radius:999px;font:inherit;font-weight:700;font-size:14px;padding:4px 12px;cursor:pointer}
.pt.on{background:var(--blue);color:#fff;border-color:var(--blue)}

main{overscroll-behavior:contain}.fphoto{object-fit:cover!important;border-radius:3px}.modal-card{overscroll-behavior:contain}
</style>
</head>
<body class="fridgepage">
<main style="padding:0;max-width:none">
  <div class="fridge" id="fridge">
    <div class="fz"></div><div class="hd hd1"></div><div class="hd hd2"></div>
    <div id="notes"></div>
    <p class="fempty hidden" id="fempty">המקרר ריק. הוסיפו פתק ראשון!</p>
    <button type="button" class="fab" id="fadd" aria-label="פתק חדש">+</button>
  </div>
</main>
<div class="modal hidden" id="modal"><div class="modal-card" id="modalCard"></div></div>
<script type="module">
import { initPage, supabase, esc, icon, avatar, ilDate, ilTime, showToast } from './js/common.js';
const { session, profiles, isAdmin } = await initPage({ title: 'פתקים על המקרר', back: 'index.html' });
const byId = Object.fromEntries(profiles.map(p => [p.id, p]));
const me = session.user.id;
const $ = id => document.getElementById(id);
const COLORS = { yellow: '#FFF18F', pink: '#FFC6DC', blue: '#BDE2FF', green: '#C6F0C2', orange: '#FFD6A3' };
const DAYS = 14;
let notes = [];

const ago = iso => {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return 'ממש עכשיו'; if (m < 60) return `לפני ${m} דקות`;
  const h = Math.round(m / 60); if (h < 24) return `לפני ${h === 1 ? 'שעה' : h + ' שעות'}`;
  const d = Math.round(h / 24); return `לפני ${d === 1 ? 'יום' : d + ' ימים'}`;
};

async function load() {
  const since = new Date(Date.now() - DAYS * 864e5).toISOString();
  const { data, error } = await supabase.from('fridge_notes').select('*').gte('created_at', since).order('created_at');
  if (error) { $('notes').innerHTML = ''; $('fempty').textContent = 'לא הצלחנו לטעון את הפתקים'; $('fempty').classList.remove('hidden'); return; }
  notes = (data || []).slice(-40); render();
}
function render() {
  $('fempty').textContent = 'המקרר ריק. הוסיפו פתק ראשון!';
  $('fempty').classList.toggle('hidden', notes.length > 0);
  $('notes').innerHTML = notes.map(n => `<button type="button" class="fnote" data-id="${n.id}" style="left:${n.x}%;top:${n.y}%;transform:rotate(${n.rot}deg);background:${COLORS[n.color] || COLORS.yellow}">
    <i class="mg"></i><span class="fav">${avatar(byId[n.user_id], 26)}</span>
    ${n.photo ? `<img class="fdraw fphoto" src="${n.photo}" alt="">` : ''}
    ${n.drawing ? `<img class="fdraw ${n.body ? 'short' : ''}" src="${n.drawing}" alt="">` : ''}
    ${n.body ? `<span class="ftxt ${n.drawing || n.photo ? 'one' : ''}">${esc(n.body)}</span>` : ''}</button>`).join('');
}
$('notes').addEventListener('click', e => { const b = e.target.closest('.fnote'); if (b) openNote(notes.find(n => n.id === b.dataset.id)); });
const close = () => { $('modal').classList.add('hidden'); document.body.style.overflow = ''; };
$('modal').addEventListener('click', e => { if (e.target === $('modal')) close(); });

function openNote(n) {
  if (!n) return;
  const p = byId[n.user_id];
  $('modalCard').innerHTML = `<button type="button" class="modal-x" id="mx" aria-label="סגירה">${icon('x', 20)}</button>
    <div class="ncard" style="background:${COLORS[n.color] || COLORS.yellow}">
      <div class="nhead">${avatar(p, 48)}<div><b>${esc(p?.name || 'מישהו')}</b><small>${ago(n.created_at)}</small></div></div>
      ${n.photo ? `<img class="nbig" src="${n.photo}" alt="">` : ''}
      ${n.drawing ? `<img class="nbig" src="${n.drawing}" alt="">` : ''}
      ${n.body ? `<p class="nbody">${esc(n.body)}</p>` : ''}</div>
    ${(n.user_id === me || isAdmin) ? `<button class="btn secondary" id="ndel" type="button" style="color:#B91C1C;border-color:#EF4444">מחיקת הפתק</button>` : ''}`;
  $('modal').classList.remove('hidden');
  $('mx').onclick = close;
  const d = $('ndel');
  if (d) d.onclick = async () => {
    if (!confirm('למחוק את הפתק?')) return;
    const { error } = await supabase.from('fridge_notes').delete().eq('id', n.id);
    if (error) { showToast('המחיקה נכשלה', true); return; }
    close(); load();
  };
}

// מיקום אקראי: מתוך כמה מועמדים בוחרים את המקום הרחוק ביותר מהפתקים הקיימים
function pickSpot() {
  const box = $('fridge').getBoundingClientRect();
  const W = box.width || 390, H = box.height || 700;
  let best = null, bestD = -1;
  for (let i = 0; i < 40; i++) {
    const x = 3 + Math.random() * 52, y = 3 + Math.random() * 72;
    let dmin = 1e9;
    for (const n of notes) dmin = Math.min(dmin, Math.hypot((n.x - x) * W / 100, (n.y - y) * H / 100));
    if (dmin > bestD) { bestD = dmin; best = { x: +x.toFixed(1), y: +y.toFixed(1) }; }
  }
  return { ...best, rot: +((Math.random() * 12) - 6).toFixed(1) };
}

function openAdd() {
  document.body.style.overflow = 'hidden';
  let photoUrl = null, color = 'yellow', drawing = false, hasInk = false, tool = 'pen', pen = '#1F2937', size = 5, hist = [];
  $('modalCard').innerHTML = `<button type="button" class="modal-x" id="mx" aria-label="סגירה">${icon('x', 20)}</button>
    <h2 style="margin:0 0 6px;font-size:20px">פתק חדש</h2>
    <div class="ncard" id="prev" style="background:${COLORS.yellow};padding:10px">
      <textarea id="nt" maxlength="200" placeholder="מה רוצים לכתוב?" style="background:transparent;border:0;min-height:80px"></textarea>
      <div id="padbox" class="hidden">
        <canvas id="pad" width="480" height="480"></canvas>
        <div class="ptools">
          ${['#1F2937', '#E11D48', '#2563EB', '#16A34A', '#F59E0B', '#9333EA'].map(c => `<button type="button" class="pc" data-c="${c}" style="background:${c}"></button>`).join('')}
          <button type="button" class="pt" data-s="3">דק</button><button type="button" class="pt" data-s="9">עבה</button>
          <button type="button" class="pt" id="er">מחק</button><button type="button" class="pt" id="un">ביטול</button><button type="button" class="pt" id="cl">נקה</button>
        </div></div></div>
    <div class="who" id="cols" style="margin-top:10px;justify-content:center">${Object.entries(COLORS).map(([k, c]) => `<button type="button" class="pc big ${k === color ? 'on' : ''}" data-k="${k}" style="background:${c}" aria-label="${k}"></button>`).join('')}</div>
    <div id="pprev" class="hidden" style="position:relative;margin-top:8px"><img id="pimg" alt="" style="width:100%;max-height:220px;object-fit:contain;border-radius:10px;background:#F3F4F6"><button type="button" class="modal-x" id="prm" aria-label="הסרת התמונה" style="top:6px">${icon('x', 18)}</button></div>
    <div class="grid2" style="margin-top:6px"><button class="btn secondary small" id="tcam" type="button" style="margin:0">📷 צילום</button><button class="btn secondary small" id="tgal" type="button" style="margin:0">🖼️ תמונה</button></div>
    <input type="file" id="fcam" accept="image/*" capture="environment" hidden><input type="file" id="fgal" accept="image/*" hidden>
    <button class="btn secondary" id="tdraw" type="button" style="margin-top:6px">✏️ הוספת ציור</button>
    <p class="error" id="nerr" role="alert"></p>
    <button class="btn" id="nsave" type="button">הדבקה על המקרר</button>`;
  $('modal').classList.remove('hidden');
  $('mx').onclick = close;
  $('cols').onclick = e => { const b = e.target.closest('[data-k]'); if (!b) return; color = b.dataset.k; $('prev').style.background = COLORS[color]; $('cols').querySelectorAll('.pc').forEach(x => x.classList.toggle('on', x === b)); };
  const cv = $('pad'), ctx = cv.getContext('2d');
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const snap = () => { hist.push(ctx.getImageData(0, 0, cv.width, cv.height)); if (hist.length > 25) hist.shift(); };
  const xy = (cx, cy) => { const r = cv.getBoundingClientRect(); return [(cx - r.left) * cv.width / r.width, (cy - r.top) * cv.height / r.height]; };
  let down = false, p0 = null, m0 = null;
  const style = () => { ctx.globalCompositeOperation = tool === 'eraser' ? 'destination-out' : 'source-over'; ctx.strokeStyle = pen; ctx.fillStyle = pen; ctx.lineWidth = tool === 'eraser' ? size * 4 : size; };
  const begin = (x, y) => { snap(); down = true; p0 = [x, y]; m0 = [x, y]; style(); ctx.beginPath(); ctx.arc(x, y, ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill(); hasInk = true; };
  const move = (x, y) => {
    if (!down) return;
    const m1 = [(p0[0] + x) / 2, (p0[1] + y) / 2];
    style(); ctx.beginPath(); ctx.moveTo(m0[0], m0[1]); ctx.quadraticCurveTo(p0[0], p0[1], m1[0], m1[1]); ctx.stroke();
    p0 = [x, y]; m0 = m1;
  };
  const end = () => { if (!down) return; down = false; style(); ctx.beginPath(); ctx.moveTo(m0[0], m0[1]); ctx.lineTo(p0[0], p0[1]); ctx.stroke(); };
  // מגע (טלפון): אירועי מגע ישירים, בלי גלילה של הדף בזמן ציור
  cv.addEventListener('touchstart', e => { e.preventDefault(); const t = e.touches[0]; begin(...xy(t.clientX, t.clientY)); }, { passive: false });
  cv.addEventListener('touchmove', e => { e.preventDefault(); const t = e.touches[0]; if (t) move(...xy(t.clientX, t.clientY)); }, { passive: false });
  cv.addEventListener('touchend', e => { e.preventDefault(); end(); }, { passive: false });
  cv.addEventListener('touchcancel', end);
  // עכבר (מחשב)
  cv.addEventListener('mousedown', e => { e.preventDefault(); begin(...xy(e.clientX, e.clientY)); });
  window.addEventListener('mousemove', e => { if (down) move(...xy(e.clientX, e.clientY)); });
  window.addEventListener('mouseup', end);
  const mark = () => { document.querySelectorAll('.ptools .pc').forEach(x => x.classList.toggle('on', tool === 'pen' && x.dataset.c === pen)); $('er').classList.toggle('on', tool === 'eraser'); };
  document.querySelector('.ptools').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.c) { pen = b.dataset.c; tool = 'pen'; }
    else if (b.dataset.s) { size = +b.dataset.s; }
    else if (b.id === 'er') tool = tool === 'eraser' ? 'pen' : 'eraser';
    else if (b.id === 'un') { const h = hist.pop(); if (h) ctx.putImageData(h, 0, 0); else ctx.clearRect(0, 0, cv.width, cv.height); if (!hist.length) hasInk = false; }
    else if (b.id === 'cl') { snap(); ctx.clearRect(0, 0, cv.width, cv.height); hasInk = false; }
    mark();
  };
  mark();
  const sync = () => {
    $('tdraw').disabled = !!photoUrl; $('tcam').disabled = $('tgal').disabled = drawing;
    $('pprev').classList.toggle('hidden', !photoUrl); if (photoUrl) $('pimg').src = photoUrl;
  };
  const shrink = file => new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 640 / Math.max(im.width, im.height)), w = Math.round(im.width * k), h = Math.round(im.height * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(im, 0, 0, w, h);
      URL.revokeObjectURL(url);
      let q = 0.72, out = c.toDataURL('image/jpeg', q);
      while (out.length > 250000 && q > 0.3) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
      res(out);
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    im.src = url;
  });
  const pick = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try { photoUrl = await shrink(f); sync(); } catch (_) { $('nerr').textContent = 'לא הצלחנו לקרוא את התמונה'; }
  };
  $('tcam').onclick = () => $('fcam').click(); $('tgal').onclick = () => $('fgal').click();
  $('fcam').onchange = pick; $('fgal').onchange = pick;
  $('prm').onclick = () => { photoUrl = null; sync(); };
  $('tdraw').onclick = () => { drawing = !drawing; sync(); $('padbox').classList.toggle('hidden', !drawing); $('nt').style.minHeight = drawing ? '44px' : '80px'; $('tdraw').textContent = drawing ? 'בלי ציור' : '✏️ הוספת ציור'; };
  $('nsave').onclick = async () => {
    const body = $('nt').value.trim();
    let img = null;
    if (drawing && hasInk) {
      img = cv.toDataURL('image/png');
      if (img.length > 200000) { const s = document.createElement('canvas'); s.width = s.height = 220; s.getContext('2d').drawImage(cv, 0, 0, 220, 220); img = s.toDataURL('image/png'); }
    }
    if (!body && !img && !photoUrl) { $('nerr').textContent = 'כתבו משהו, צרו ציור או הוסיפו תמונה'; return; }
    $('nsave').disabled = true;
    const { error } = await supabase.from('fridge_notes').insert({ user_id: me, body: body || null, drawing: img, photo: photoUrl, color, ...pickSpot() });
    if (error) { $('nerr').textContent = 'השמירה נכשלה: ' + error.message; $('nsave').disabled = false; return; }
    close(); await load();
  };
}
$('fadd').onclick = openAdd;
supabase.rpc('purge_fridge_notes').then(() => {}, () => {});
await load();
setInterval(() => { if (!document.hidden && $('modal').classList.contains('hidden')) load(); }, 10000);
</script>
</body>
</html>
