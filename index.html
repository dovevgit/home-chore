<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הבית שלנו</title>
<meta name="theme-color" content="#0D6EFD">
<meta name="color-scheme" content="only light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="js/splash.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <div id="announce"></div>
  <div id="bday"></div>
  <div id="leader"></div>
  <div class="card" style="margin-bottom:8px"><div class="sec-title" style="margin:0">סיכום היום</div>
    <div class="stats" id="stats"><p class="empty" style="flex:1">טוען...</p></div></div>
  <div class="sec-title">בני המשפחה</div>
  <div class="family" id="family"></div>
  <div id="outAdmin"></div>
  <button type="button" class="reqcard outcard" id="outBtn"></button>
  <a class="reqcard" href="requests.html" id="reqCard"><span id="reqIcon"></span><b id="reqTitle">אין בקשות</b><span id="reqBadge"></span></a>
  <div class="sec-head"><div class="sec-title">המשימות של היום</div><a href="tasks.html">הצג הכל</a></div>
  <div id="tasks"><p class="empty">טוען...</p></div>
  <div class="sec-head"><div class="sec-title">מה קרה לאחרונה</div><a href="history.html">הצג הכל</a></div>
  <div id="recent"><p class="empty">טוען...</p></div>
  <div class="sec-head"><div class="sec-title">הודעות אחרונות</div><a href="chat.html" id="chatLink">לצ'אט המלא</a></div>
  <div id="feed"><p class="empty">טוען...</p></div>
  <form class="quickmsg" id="quick" autocomplete="off">
    <input id="qtext" type="text" placeholder="כתבו הודעה למשפחה..." maxlength="500" enterkeyhint="send">
    <button class="cbtn send" id="qsend" type="submit" aria-label="שליחה"></button>
  </form>
</main>
<div class="modal hidden" id="pmodal"><div class="modal-card" id="pcard"></div></div>
<script type="module">
import { initPage, supabase, esc, icon, iconBox, tintOf, avatar, pointsFor, ilDate, ilTime, addDays, reportCounts, deriveStatus, nextSlot, STATUS } from './js/common.js';
import { weeklyPoints } from './js/points.js';
const { me, profiles } = await initPage({ active: 'home', title: 'הבית שלנו' });
const byId = Object.fromEntries(profiles.map(p => [p.id, p]));
const today = ilDate(new Date());

/* --- נקודות שבועיות, מוביל ובני משפחה --- */
const { pointsByUser } = await weeklyPoints();
const users = profiles.filter(p => p.is_user);
const best = Math.max(0, ...users.map(u => pointsByUser[u.id] || 0));
const leaders = best > 0 ? users.filter(u => (pointsByUser[u.id] || 0) === best) : [];
document.getElementById('leader').innerHTML = leaders.length ? `
  <div class="card leader">${avatar(leaders[0], 52)}
    <div style="flex:1"><div class="lsub">המוביל השבועי</div><div class="ltitle">${leaders.map(l => esc(l.name)).join(' ו')}</div>
    <div class="lsub"><span dir="ltr">${best}</span> נקודות</div></div>
    <span class="crown">${icon('crown', 26)}</span></div>` : '';
const { data: awayRows } = await supabase.from('absences').select('user_id,reason').lte('start_date', today).gte('end_date', today);
const away = Object.fromEntries((awayRows || []).map(r => [r.user_id, r.reason]));
const { data: outRows } = await supabase.rpc('current_outings');
const outNow = Object.fromEntries((outRows || []).map(r => [r.user_id, r.reason]));
document.getElementById('family').innerHTML = users.map(p => `
  <button type="button" class="avn ${away[p.id] ? 'away' : ''}" data-uid="${p.id}" aria-label="הכרטיס של ${esc(p.name)}">${avatar(p, 54)}<span class="avname">${esc(p.name)}</span>${away[p.id] ? `<span class="abs-tag">נעדר/ת</span><span class="apts abs-why">${esc(away[p.id])}</span>` : outNow[p.id] ? `<span class="abs-tag out">לא בבית</span><span class="apts abs-why">${esc(outNow[p.id])}</span>` : `<span class="apts" dir="ltr">${pointsByUser[p.id] || 0}</span>`}</button>`).join('');

/* --- כרטיס משתמש --- */
const dmy = d => d.split('-').reverse().join('.');
const dayNum = d => { const [y, m, dd] = d.split('-').map(Number); return Date.UTC(y, m - 1, dd) / 864e5; };
function bdayInfo(b) {
  if (!b) return null;
  const [by, bm, bd] = b.split('-').map(Number), [ty] = today.split('-').map(Number);
  let next = `${ty}-${String(bm).padStart(2, '0')}-${String(bd).padStart(2, '0')}`;
  if (next < today) next = `${ty + 1}-${String(bm).padStart(2, '0')}-${String(bd).padStart(2, '0')}`;
  const days = dayNum(next) - dayNum(today);
  return { days, age: Number(next.slice(0, 4)) - by };
}
const bdayText = i => i.days === 0 ? `היום יום ההולדת! (גיל ${i.age})` : `בעוד ${i.days === 1 ? 'יום אחד' : i.days + ' ימים'} · יום הולדת ${i.age}`;
const pm = document.getElementById('pmodal'), pc = document.getElementById('pcard');
pm.addEventListener('click', e => { if (e.target === pm) pm.classList.add('hidden'); });
function openCard(uid, editMode = false) {
  const p = byId[uid]; if (!p) return;
  const bi = bdayInfo(p.birthday);
  const x = `<button type="button" class="modal-x" id="px" aria-label="סגירה">${icon('x', 20)}</button>`;
  const head = `<div class="pbig">${avatar(p, 150)}<h2>${esc(p.name)}</h2></div>`;
  if (editMode) {
    pc.innerHTML = `${x}${head}
      <label for="pBd">תאריך לידה</label><input id="pBd" type="date" value="${p.birthday || ''}" dir="ltr">
      <label for="pAbout">מה כדאי לדעת</label><textarea id="pAbout" maxlength="400" placeholder="למשל: אלרגיה, אוכל אהוב, מידת נעליים">${esc(p.about || '')}</textarea>
      <p class="error" id="pErr" role="alert"></p>
      <button class="btn" id="pSave" type="button">שמירה</button>
      <button class="btn secondary" id="pCancel" type="button">ביטול</button>`;
    pc.querySelector('#pCancel').onclick = () => openCard(uid);
    pc.querySelector('#pSave').onclick = async () => {
      const row = { birthday: pc.querySelector('#pBd').value || null, about: pc.querySelector('#pAbout').value.trim() || null };
      pc.querySelector('#pSave').disabled = true;
      const { error } = await supabase.from('profiles').update(row).eq('id', uid);
      if (error) { pc.querySelector('#pErr').textContent = 'השמירה נכשלה: ' + error.message; pc.querySelector('#pSave').disabled = false; return; }
      Object.assign(p, row); showBday(); openCard(uid);
    };
  } else {
    pc.innerHTML = `${x}${head}
      ${away[uid] ? `<div class="pline"><span class="abs-tag">נעדר/ת</span> ${esc(away[uid])}</div>` : ''}
      <div class="pline">${p.birthday ? `<b>🎂 נולד/ה ב-${dmy(p.birthday)}</b><br><small>${esc(bdayText(bi))}</small>` : '<small>עוד לא הוזן תאריך לידה</small>'}</div>
      <div class="pline"><b>מה כדאי לדעת</b><br>${p.about ? esc(p.about).replace(/\n/g, '<br>') : '<small>עוד לא נכתב</small>'}</div>
      <div class="pline"><b>נקודות השבוע:</b> <span dir="ltr">${pointsByUser[uid] || 0}</span></div>
      ${me?.role === 'admin' ? `<button class="btn secondary" id="pEdit" type="button">${icon('pencil', 18)} עריכה</button>` : ''}`;
    pc.querySelector('#pEdit')?.addEventListener('click', () => openCard(uid, true));
  }
  pc.querySelector('#px').onclick = () => pm.classList.add('hidden');
  pm.classList.remove('hidden');
}
document.getElementById('family').addEventListener('click', e => { const b = e.target.closest('[data-uid]'); if (b) openCard(b.dataset.uid); });
function showBday() {
  const t = users.filter(u => bdayInfo(u.birthday)?.days === 0);
  document.getElementById('bday').innerHTML = t.length ? t.map(u => `<div class="bdaycard">🎂 יום הולדת שמח, ${esc(u.name)}! 🎉</div>`).join('') : '';
}
showBday();

/* --- אני לא בבית --- */
const OUT_REASONS = ['לינה אצל חברה', 'טיול', 'בילוי', 'אחר'];
const telOf = v => String(v || '').replace(/[^\d+]/g, '');
let outs = [];
const outDates = o => o.start_date === o.end_date ? dmy(o.start_date) : `${dmy(o.start_date)} עד ${dmy(o.end_date)}`;
async function loadOuts() {
  const { data, error } = await supabase.from('outings').select('*').is('returned_at', null).gte('end_date', today).order('start_date');
  outs = error ? [] : (data || []); renderOuts();
}
function renderOuts() {
  const mine = outs.filter(o => o.user_id === me?.id);
  const b = document.getElementById('outBtn');
  b.innerHTML = `<span>${icon('house', 26)}</span><b>${mine.length ? `רשום/ה כלא בבית: ${esc(mine[0].reason)} · ${outDates(mine[0])}` : 'אני לא בבית'}</b>`;
  b.classList.toggle('active', mine.length > 0);
  b.onclick = () => mine.length ? showOut(mine[0]) : openOut(null);
  const others = me?.role === 'admin' ? outs.filter(o => o.user_id !== me.id) : [];
  document.getElementById('outAdmin').innerHTML = others.length ? `<div class="sec-title">לא בבית</div>` + others.map(o => outCardHtml(o)).join('') : '';
}
function outCardHtml(o) {
  const p = byId[o.user_id];
  const when = o.start_date > today ? `מתחיל ב-${dmy(o.start_date)}` : outDates(o);
  return `<div class="card outinfo" style="margin-bottom:8px"><div class="outhead">${avatar(p, 44)}<div><b>${esc(p?.name || '')} · ${esc(o.reason)}</b><small>${when}</small></div></div>
    <div class="outrow"><span>איפה</span><b>${esc(o.place)}</b></div>
    ${o.with_whom ? `<div class="outrow"><span>עם מי</span><b>${esc(o.with_whom)}</b></div>` : ''}
    <div class="outrow"><span>טלפון</span><b dir="ltr">${esc(o.phone)}</b></div>
    ${o.address ? `<div class="outrow"><span>כתובת</span><b>${esc(o.address)}</b></div>` : ''}
    ${o.note ? `<div class="outrow"><span>הערה</span><b>${esc(o.note)}</b></div>` : ''}
    <div class="outbtns"><a class="ibtn call" href="tel:${esc(telOf(o.phone))}" aria-label="חיוג">${icon('phone', 20)}</a>
    ${o.address ? `<a class="ibtn" href="https://waze.com/ul?q=${encodeURIComponent(o.address)}&navigate=yes" target="_blank" rel="noopener" aria-label="ניווט">${icon('map-pin', 20)}</a>` : ''}</div></div>`;
}
function showOut(o) {
  pc.innerHTML = `<button type="button" class="modal-x" id="px" aria-label="סגירה">${icon('x', 20)}</button><h2 style="margin:0 0 10px">אני לא בבית</h2>
    ${outCardHtml(o)}
    <button class="btn" id="oBack" type="button">חזרתי הביתה</button>
    <button class="btn secondary" id="oEdit" type="button">עריכה</button>
    <button class="btn secondary" id="oDel" type="button" style="color:#B91C1C;border-color:#EF4444">מחיקה</button>`;
  pm.classList.remove('hidden');
  pc.querySelector('#px').onclick = () => pm.classList.add('hidden');
  pc.querySelector('#oEdit').onclick = () => openOut(o);
  pc.querySelector('#oBack').onclick = async () => { await supabase.from('outings').update({ returned_at: new Date().toISOString() }).eq('id', o.id); pm.classList.add('hidden'); await loadOuts(); };
  pc.querySelector('#oDel').onclick = async () => { if (!confirm('למחוק?')) return; await supabase.from('outings').delete().eq('id', o.id); pm.classList.add('hidden'); await loadOuts(); };
}
function openOut(o) {
  const r = o || { reason: OUT_REASONS[0], start_date: today, end_date: today, place: '', with_whom: '', phone: '', address: '', note: '' };
  let reason = OUT_REASONS.includes(r.reason) ? r.reason : 'אחר';
  pc.innerHTML = `<button type="button" class="modal-x" id="px" aria-label="סגירה">${icon('x', 20)}</button>
    <h2 style="margin:0 0 6px">${o ? 'עדכון' : 'אני לא בבית'}</h2>
    <label>לאן / למה</label><div class="who" id="oRs">${OUT_REASONS.map(x => `<button type="button" class="whochip ${x === reason ? 'on' : ''}" data-r="${x}">${x}</button>`).join('')}</div>
    <div class="grid2"><div><label for="oFrom">מתאריך</label><input id="oFrom" type="date" value="${r.start_date}" dir="ltr"></div>
    <div><label for="oTo">עד תאריך</label><input id="oTo" type="date" value="${r.end_date}" dir="ltr"></div></div>
    <label for="oPlace">איפה (שם החברה או המקום)</label><input id="oPlace" maxlength="100" value="${esc(r.place)}">
    <label for="oWith">שם ההורה / המבוגר האחראי</label><input id="oWith" maxlength="80" value="${esc(r.with_whom || '')}">
    <label for="oPhone">טלפון (של החברה או של ההורה שלה)</label><input id="oPhone" type="tel" maxlength="30" dir="ltr" value="${esc(r.phone)}" inputmode="tel">
    <label for="oAddr">כתובת</label><input id="oAddr" maxlength="200" value="${esc(r.address || '')}" placeholder="רחוב, מספר, עיר">
    <label for="oNote">הערה (לא חובה)</label><input id="oNote" maxlength="200" value="${esc(r.note || '')}">
    <p class="error" id="oErr" role="alert"></p>
    <button class="btn" id="oSave" type="button">שמירה</button>`;
  pm.classList.remove('hidden');
  pc.querySelector('#px').onclick = () => pm.classList.add('hidden');
  pc.querySelector('#oRs').onclick = e => { const b = e.target.closest('[data-r]'); if (!b) return; reason = b.dataset.r; pc.querySelectorAll('#oRs .whochip').forEach(x => x.classList.toggle('on', x === b)); };
  pc.querySelector('#oSave').onclick = async () => {
    const q = id => pc.querySelector(id).value.trim();
    const row = { reason, start_date: q('#oFrom'), end_date: q('#oTo'), place: q('#oPlace'), with_whom: q('#oWith') || null, phone: q('#oPhone'), address: q('#oAddr') || null, note: q('#oNote') || null };
    const err = m => { pc.querySelector('#oErr').textContent = m; };
    if (!row.start_date || !row.end_date) return err('צריך לבחור תאריכים');
    if (row.end_date < row.start_date) return err('תאריך הסיום לפני תאריך ההתחלה');
    if (!row.place) return err('צריך לכתוב איפה');
    if (row.phone.replace(/\D/g, '').length < 7) return err('צריך מספר טלפון תקין');
    if (reason === 'לינה אצל חברה' && !row.address) return err('בלינה אצל חברה צריך גם כתובת');
    pc.querySelector('#oSave').disabled = true;
    const res = o ? await supabase.from('outings').update(row).eq('id', o.id) : await supabase.from('outings').insert({ ...row, user_id: me.id });
    if (res.error) { pc.querySelector('#oSave').disabled = false; return err('השמירה נכשלה: ' + res.error.message); }
    pm.classList.add('hidden'); await loadOuts();
  };
}
loadOuts();

/* --- המשימות של היום וסיכום --- */
const { data: all, error: tErr } = await supabase.from('tasks').select('*').eq('kind', 'occurrence').eq('active', true).gte('occurrence_date', addDays(today, -1)).lte('occurrence_date', today);
const tEl = document.getElementById('tasks');
if (tErr) { tEl.innerHTML = '<p class="empty">לא הצלחנו לטעון משימות</p>'; document.getElementById('stats').innerHTML = ''; }
else {
  const todays = all.filter(t => (t.slots || []).length ? t.slots.some(sl => sl.due_at && ilDate(new Date(sl.due_at)) === today) : t.occurrence_date === today);
  const counts = await reportCounts(todays.map(t => t.id));
  const rows = todays.map(t => { const c = counts[t.id] || 0; return { t, c, status: deriveStatus(t, c), slot: nextSlot(t, c) }; });
  const done = rows.filter(r => r.status === 'done').length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="num">${rows.length}</div><div class="slab">סה"כ משימות</div></div>
    <div class="stat"><div class="num" style="color:#15803D">${done}</div><div class="slab">בוצעו</div></div>
    <div class="stat"><div class="num" style="color:#B45309">${rows.length - done}</div><div class="slab">נשארו</div></div>`;
  const open = rows.filter(r => r.status !== 'done')
    .sort((a, b) => (b.status === 'overdue') - (a.status === 'overdue') || new Date(a.slot?.due_at || '2100-01-01') - new Date(b.slot?.due_at || '2100-01-01')).slice(0, 3);
  tEl.innerHTML = !rows.length ? '<p class="empty">אין משימות להיום</p>' : open.length ? open.map(({ t, c, status, slot }) => {
    const S = STATUS[status];
    return `<a class="tcard" href="task.html?id=${t.id}" style="background:${tintOf(t)}">
      <span class="sdot ${S.cls}">${status === 'done' ? icon('check', 14) : ''}</span>${iconBox(t)}
      <div class="tmain"><b>${esc(t.title)}${t.times_required > 1 || c > t.times_required ? ` <span dir="ltr">(${c}/${t.times_required})</span>` : ''}</b><small>${slot?.due_at ? `<span dir="ltr">${ilTime(new Date(slot.due_at))}</span>` : ''}</small></div>
      <span class="chip ${S.cls}">${icon(S.icon === 'clock' ? 'hourglass' : S.icon, 13)} ${S.label}</span>${avatar(byId[slot?.assignee_id], 34)}</a>`;
  }).join('') : '<p class="empty">כל משימות היום בוצעו</p>';
}

/* --- מה קרה לאחרונה --- */
const { data: reps } = await supabase.from('feed').select('*').eq('type', 'report').order('created_at', { ascending: false }).limit(3);
const rEl = document.getElementById('recent');
if (!reps || !reps.length) rEl.innerHTML = '<p class="empty">עוד לא דווחו משימות</p>';
else {
  const ids = [...new Set(reps.map(r => r.task_id))];
  const { data: ts } = await supabase.from('tasks').select('*').in('id', ids);
  const tById = Object.fromEntries((ts || []).map(t => [t.id, t]));
  const paths = reps.map(r => r.photo_path).filter(Boolean);
  const urls = {};
  if (paths.length) {
    const { data: signed } = await supabase.storage.from('photos').createSignedUrls(paths, 3600);
    (signed || []).forEach(sg => { if (sg.path && sg.signedUrl) urls[sg.path] = sg.signedUrl; });
  }
  rEl.innerHTML = reps.map(r => {
    const t = tById[r.task_id]; const who = byId[r.user_id];
    const slot = t && r.payload?.slot_n ? (t.slots || [])[r.payload.slot_n - 1] : null;
    const pts = t ? pointsFor(t, slot, new Date(r.created_at)).points : 0;
    const when = ilDate(new Date(r.created_at)) === today ? 'היום' : ilDate(new Date(r.created_at));
    return `<div class="card recent" style="margin-bottom:8px;padding:8px 12px">${avatar(who, 40)}
      <div style="flex:1;min-width:0"><b style="font-size:16px">${esc(who?.name || 'מישהו')} ביצע/ה: ${esc(t?.title || '')}</b>
      <div class="note" style="text-align:start;margin:0"><span dir="ltr">${ilTime(new Date(r.created_at))}</span> ${when}${r.body ? ' · ' + esc(r.body) : ''} · <span class="pts" dir="ltr">+${pts}</span></div></div>
      ${urls[r.photo_path] ? `<img class="th" src="${urls[r.photo_path]}" alt="">` : ''}</div>`;
  }).join('');
}

/* --- הודעות: תג שלא נקראו, רשימה ושורת כתיבה --- */
document.getElementById('qsend').innerHTML = icon('send', 22);
async function loadFeed() {
  const { data: feed, error: fErr } = await supabase.from('feed').select('id,type,user_id,body,photo_path,created_at').in('type', ['system', 'chat']).order('created_at', { ascending: false }).limit(4);
  const fEl = document.getElementById('feed');
  if (fErr) { fEl.innerHTML = '<p class="empty">לא הצלחנו לטעון הודעות</p>'; return; }
  if (!feed.length) { fEl.innerHTML = '<p class="empty">אין הודעות עדיין. כתבו הודעה ראשונה!</p>'; return; }
  fEl.innerHTML = feed.slice().reverse().map(m => m.type === 'system'
    ? `<div class="sys"><small>הודעת מערכת · ${ilTime(new Date(m.created_at))}</small>${esc(m.body)}</div>`
    : `<div class="msg ${m.user_id === me?.id ? 'mine' : ''}">${avatar(byId[m.user_id], 34)}
        <div class="bubble">${m.user_id === me?.id ? '' : `<b>${esc(byId[m.user_id]?.name || 'מישהו')}</b>`}${m.photo_path ? '<div>📷 תמונה</div>' : ''}${m.body ? `<div>${esc(m.body)}</div>` : ''}<span class="mtime" dir="ltr">${ilTime(new Date(m.created_at))}</span></div></div>`).join('');
  let seen = ''; try { seen = localStorage.getItem('chatSeen') || ''; } catch (_) {}
  const n = feed.filter(m => m.user_id !== me?.id && (!seen || m.created_at > seen)).length;
  const l = document.getElementById('chatLink');
  l.innerHTML = 'לצ\'אט המלא' + (n ? ` <span class="badge2">${n > 9 ? '9+' : n}</span>` : '');
}
(async () => {
  const { data: an } = await supabase.from('app_settings').select('value').eq('key', 'announcement').maybeSingle();
  const txt = (an?.value || '').trim();
  document.getElementById('announce').innerHTML = txt ? `<div class="announce"><span class="trophy"><svg viewBox="0 0 64 64" width="72" height="72" aria-hidden="true"><defs><linearGradient id="gld" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE98A"/><stop offset=".5" stop-color="#FFC21A"/><stop offset="1" stop-color="#E08A00"/></linearGradient></defs><path d="M17 8h30v14c0 9-6.5 16-15 16S17 31 17 22z" fill="url(#gld)" stroke="#B86E00" stroke-width="2" stroke-linejoin="round"/><path d="M17 12H8c0 9 4 15 11 16M47 12h9c0 9-4 15-11 16" fill="none" stroke="#D98A00" stroke-width="3.5" stroke-linecap="round"/><path d="M28 37h8l1 9H27z" fill="url(#gld)" stroke="#B86E00" stroke-width="2" stroke-linejoin="round"/><rect x="20" y="46" width="24" height="8" rx="2.5" fill="url(#gld)" stroke="#B86E00" stroke-width="2"/><path d="M32 13l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5-3.6-3.5 5-.7z" fill="#FFF7D1" opacity=".9"/><path d="M22 12v10" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".55"/></svg></span><b>${esc(txt)}</b></div>` : '';
})();
document.getElementById('reqIcon').innerHTML = icon('hand-heart', 28);
async function loadReqBadge() {
  const { data } = await supabase.from('requests').select('id,created_by,to_users,status,declined_by').in('status', ['open', 'taken']);
  const n = (data || []).filter(r => r.status === 'open' && r.created_by !== me?.id && (!r.to_users || !r.to_users.length || r.to_users.includes(me?.id)) && !(r.declined_by || []).includes(me?.id)).length;
  const any = (data || []).length > 0;   // כל בקשה פתוחה שאני רואה, גם שלי
  document.getElementById('reqCard').classList.toggle('alert', any);
  document.getElementById('reqTitle').textContent = any ? 'בקשות מיוחדות' : 'אין בקשות';
  document.getElementById('reqBadge').innerHTML = n ? `<span class="badge2">${n > 9 ? '9+' : n}</span>` : '';
}
loadReqBadge();
setInterval(() => { if (!document.hidden) loadReqBadge(); }, 15000);
await loadFeed();
try {
  supabase.channel('feed-home')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'feed', filter: 'type=in.(chat,system)' }, () => loadFeed())
    .subscribe();
} catch (_) {}
setInterval(() => { if (!document.hidden) loadFeed(); }, 8000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadFeed(); });
document.getElementById('quick').addEventListener('submit', async e => {
  e.preventDefault();
  const input = document.getElementById('qtext'); const body = input.value.trim(); if (!body) return;
  input.value = ''; document.getElementById('qsend').disabled = true;
  const { error } = await supabase.from('feed').insert({ type: 'chat', user_id: me.id, body });
  document.getElementById('qsend').disabled = false;
  if (error) { input.value = body; alert('השליחה נכשלה, אפשר לנסות שוב'); return; }
  try { localStorage.setItem('chatSeen', new Date().toISOString()); } catch (_) {}
  loadFeed();
});
</script>
