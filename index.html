<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הבית שלנו</title>
<meta name="theme-color" content="#0D6EFD">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <p id="hello" class="help" style="text-align:start"></p>
  <h2>המשימות של היום</h2>
  <div id="tasks"><p class="empty">טוען...</p></div>
  <p style="text-align:center"><a href="tasks.html" style="color:#0A58CA;font-weight:700">הצג הכל</a></p>
  <h2>הודעות אחרונות</h2>
  <div id="feed"><p class="empty">טוען...</p></div>
</main>
<script type="module">
import { initPage, supabase, esc, icon, iconBox, ilDate, ilTime, reportCounts, deriveStatus, nextSlot, STATUS } from './js/common.js';
const { me } = await initPage({ active: 'home', title: 'הבית שלנו' });
document.getElementById('hello').textContent = me ? `שלום, ${me.name}` : '';

const today = ilDate(new Date());
const { data: all, error: tErr } = await supabase.from('tasks').select('*').eq('kind', 'occurrence').eq('active', true).eq('occurrence_date', today);
const tEl = document.getElementById('tasks');
if (tErr) tEl.innerHTML = '<p class="empty">לא הצלחנו לטעון משימות</p>';
else if (!all.length) tEl.innerHTML = '<p class="empty">אין משימות להיום</p>';
else {
  const counts = await reportCounts(all.map(t => t.id));
  const rows = all.map(t => ({ t, c: counts[t.id] || 0 })).map(r => ({ ...r, status: deriveStatus(r.t, r.c), slot: nextSlot(r.t, r.c) }))
    .filter(r => r.status !== 'done')
    .sort((a, b) => (b.status === 'overdue') - (a.status === 'overdue') || new Date(a.slot?.due_at || '2100-01-01') - new Date(b.slot?.due_at || '2100-01-01'))
    .slice(0, 3);
  tEl.innerHTML = rows.length ? rows.map(({ t, status, slot }) => `
    <a class="tcard" href="task.html?id=${t.id}">${iconBox(t)}
      <div class="tmain"><b>${esc(t.title)}</b><small>${slot?.due_at ? `<span dir="ltr">${ilTime(new Date(slot.due_at))}</span>` : ''}</small></div>
      <span class="chip ${STATUS[status].cls}">${icon(STATUS[status].icon, 14)} ${STATUS[status].label}</span></a>`).join('')
    : '<p class="empty">כל משימות היום בוצעו</p>';
}

const { data: feed, error: fErr } = await supabase.from('feed').select('id,type,body,created_at').in('type', ['system', 'chat']).order('created_at', { ascending: false }).limit(5);
const fEl = document.getElementById('feed');
if (fErr) fEl.innerHTML = '<p class="empty">לא הצלחנו לטעון הודעות</p>';
else if (!feed.length) fEl.innerHTML = '<p class="empty">אין הודעות עדיין</p>';
else fEl.innerHTML = feed.map(m => `<div class="sys"><small>${m.type === 'system' ? 'הודעת מערכת' : 'הודעה'} · ${ilTime(new Date(m.created_at))}</small>${esc(m.body)}</div>`).join('');
</script>
</body>
</html>
